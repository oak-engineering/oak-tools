<title>OAK Auditbogen</title>
<style>
:root{

  --bg:#F7F9F8; --line:#DCE5E0; --muted:#6B7C74; --text:#1D2A24;
  --rot:#B3261E; --gelb:#B8860B;
  --body:'Jost','Segoe UI',system-ui,-apple-system,sans-serif;
  --kopf:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;
  padding-bottom:150px}
h1,h2,h3{font-family:var(--kopf);font-weight:600;margin:0 0 6px}
h1{font-size:23px} h2{font-size:20px} h3{font-size:17px;font-family:var(--body);font-weight:600}
p{margin:0 0 8px}
.wrap{max-width:760px;margin:0 auto;padding:12px}

header{background:var(--dunkel);color:#fff;padding:10px 12px;position:sticky;top:0;z-index:50}
header .wrap{padding:0;display:flex;align-items:center;gap:10px}
header h1{color:#fff;font-size:19px;margin:0;flex:1}
header .sub{font-size:12px;color:#B7E4C7;display:block;font-family:var(--body)}
.kopfbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:9px;padding:7px 9px;
  cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--body);font-size:13px}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
.card h3{margin-bottom:8px}
.card.warn{border-color:var(--gelb);background:#FFFBF0}
.card.krit{border-color:var(--rot);background:#FEF6F5}
.krit-x{color:var(--rot)}
.t2.fehlt{color:var(--rot);font-weight:600}
.fehlt{color:var(--rot);font-weight:700}
.tipp.norm summary{color:var(--dunkel)}
.normtext{white-space:pre-wrap;font-size:14px;line-height:1.5;max-height:46vh;overflow:auto;
  border-left:3px solid var(--hell);padding-left:10px}

label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:9px 0 3px}
input,textarea,select{width:100%;font-family:var(--body);font-size:16px;padding:10px;
  border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
textarea{min-height:74px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--hell);outline-offset:-1px}
.zwei{display:flex;gap:8px}.zwei>*{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#fff;
  border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;font-family:var(--body);
  font-size:15px;font-weight:500;color:var(--text);cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--gruen);border-color:var(--gruen);color:#fff;font-weight:600}
.btn.gefahr{border-color:var(--rot);color:var(--rot)}
.btn.klein{padding:7px 10px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ic{width:19px;height:19px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

.fussblock{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(27,67,50,.1);
  padding-bottom:env(safe-area-inset-bottom)}
.fussblock-inner{max-width:760px;margin:0 auto}
.hauptzeile{display:flex;gap:8px;padding:8px 12px 2px}
.hauptzeile .btn{flex:1;padding:14px;font-size:16.5px;font-weight:600;border-width:2px}
.tabbar{display:flex;padding:2px 6px 6px}
.tab{flex:1;background:none;border:0;border-radius:10px;padding:7px 2px 6px;cursor:pointer;
  font-family:var(--body);font-size:11.5px;font-weight:500;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .ic{width:23px;height:23px}
.tab.on{color:var(--gruen);font-weight:600;background:var(--akzent)}
.tab i{font-style:normal;background:var(--gruen);color:#fff;border-radius:999px;padding:0 6px;
  margin-left:3px;font-size:11px;font-weight:700}
.tab:active{transform:scale(.96)}

.panel{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.panel[hidden]{display:none}
.pnlkopf{background:var(--dunkel);color:#fff;padding:11px 12px;display:flex;align-items:center;gap:10px}
.pnlkopf h2{color:#fff;margin:0;flex:1;font-size:18px}
.pnlbody{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.pnlbody .wrap{padding:0}

.hak{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;color:var(--text);
  padding:9px 0;border-bottom:1px solid var(--line);margin:0;cursor:pointer}
.hak:last-child{border-bottom:0}
.hak input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--gruen)}
.hak.pflicht{background:#FFFBF0;margin:0 -6px;padding:9px 6px;border-radius:6px}
.hak.pflicht span b{color:#8B5A00}
.sn{display:inline-block;min-width:19px;height:19px;line-height:19px;text-align:center;font-size:12px;
  border-radius:999px;background:var(--gruen);color:#fff;margin-right:5px}
.pkt{letter-spacing:1px;color:var(--gruen);font-size:11px}
.zeile{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.zeile:last-child{border-bottom:0}
.zeile .txt{flex:1;min-width:0}
.zeile .t1{font-weight:600;font-size:15px}
.zeile .t2{font-size:12.5px;color:var(--muted)}
.chev{color:var(--muted)}

.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;
  background:var(--akzent);color:var(--dunkel);margin-right:5px}
.pill.k{background:#D8F3DC;color:#1B4332}
.pill.n{background:#FFF3CD;color:#7A5C00}
.pill.ka{background:#FADBD8;color:#8B1A13}
.pill.p{background:#E3EFFA;color:#1A4971}
.pill.off{background:#EEF1EF;color:var(--muted)}

.hinweis{background:var(--akzent);border-left:3px solid var(--gruen);border-radius:0 9px 9px 0;
  padding:9px 11px;font-size:13.5px;margin:9px 0}
.hinweis b{color:var(--dunkel)}
details.tipp{margin:8px 0}
details.tipp summary{cursor:pointer;font-size:13px;color:var(--gruen);font-weight:600;
  display:flex;align-items:center;gap:5px;list-style:none}
details.tipp summary::-webkit-details-marker{display:none}
details.tipp .inh{font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:10px;margin-top:6px}

.balken{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:5px 0}
.balken>i{display:block;height:100%;background:var(--hell)}
.leer{text-align:center;color:var(--muted);padding:26px 12px;font-size:14.5px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
th{background:var(--akzent);color:var(--dunkel);font-weight:600;font-size:12.5px}
td input,td select{padding:6px;font-size:14px;border-radius:7px}
.mini{font-size:12.5px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:160px;background:var(--dunkel);
  color:#fff;padding:10px 15px;border-radius:11px;z-index:99;font-size:14.5px;opacity:0;
  transition:opacity .2s;pointer-events:none}
#toast.an{opacity:1}
/* ===== Desktop: der eigentliche Arbeitsplatz =====
   Am PC ist Platz da - er wird genutzt, statt die Handyansicht breitzuziehen. Zweispaltig:
   links der Pruefpunkt, rechts Stichprobe und Ergebnis. Die Fussleiste bleibt (gleiche Bedienung
   wie im Begehungstool), rueckt aber in die Breite. */
@media(min-width:900px){
  body{padding-bottom:120px;font-size:16.5px}
  .wrap{max-width:1180px;padding:18px}
  .fussblock-inner{max-width:1180px;display:flex;align-items:center;gap:18px}
  .hauptzeile{flex:0 0 320px;padding:8px 12px}
  .tabbar{flex:1;padding:6px 12px}
  .tab{flex:0 0 auto;padding:8px 18px;flex-direction:row;gap:7px;font-size:14px}
  .tab .ic{width:19px;height:19px}
  .panel{inset:5vh 50% auto 50%;transform:translateX(-50%);width:min(1000px,92vw);
    max-height:90vh;border-radius:16px;overflow:hidden;box-shadow:0 18px 60px rgba(27,67,50,.3)}
  .pnlbody{padding:20px}
  table{min-width:0}
  /* Zweispaltig: die Spalten werden im JS gesetzt (.sp-links / .sp-rechts) */
  #haupt.zwei-spalten{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
  #haupt.zwei-spalten .voll{grid-column:1 / -1}
  .kapnav{position:sticky;top:74px}
  .kapnav .zeile{padding:7px 0;font-size:14px}

@media(min-width:1400px){ .wrap{max-width:1320px} #haupt.zwei-spalten{grid-template-columns:1fr 420px} }
@media(min-width:800px) and (max-width:899px){ table{min-width:0} }
</style>
</head>

   statt "Planung von Aenderungen". Wer nur die Nummer nachschlaegt, zitiert den falschen Text.
   null bedeutet: In dieser Norm gibt es den Abschnitt nicht. */

  const nid = normId || normFuer(a);

  if(!n) return null;
  const m = String(bezug).match(/(\d+(?:\.\d+)+|\b\d\b)/);

  const abw = NORM_ABWEICHUNG[nid];
  if(abw && Object.prototype.hasOwnProperty.call(abw, nr)){
    if(abw[nr]===null) return {norm:nid, nr:nr, fehlt:true};
    nr = abw[nr];

  const abs = n.abschnitte[nr];
  return abs ? {norm:nid, nr:nr, titel:abs.titel, text:abs.text, ausgabe:n.ausgabe} : null;

  if(!m) return bezug||"";
  const nr = m[1];
  if((a.disziplin||"umwelt")==="umwelt" && (a.normfassung||"2026")==="2015" && NORMFASSUNG_2015[nr])

function zeichneSkaliert(src,w,h,kat){

function fotoAufnehmen(kat, cb){
  const inp=document.createElement("input");

    setTimeout(()=>inp.remove(), 0);
  };
  document.body.appendChild(inp);
  inp.click();
}

/* Genau EIN Aufnahmezustand fuer die ganze App. Zwei parallele Recorder waeren nur eine
   Fehlerquelle - und ein weiterlaufendes Mikrofon nach dem Schliessen des Panels waere
   ein Datenschutzproblem, kein Schoenheitsfehler. */
let aufnahme = null;   // {rec, stream, chunks, start, timer, ziel}
function audioLaeuft(){ return !!aufnahme; }
function audioStoppen(){
  if(!aufnahme) return;
  try{ if(aufnahme.rec && aufnahme.rec.state!=="inactive") aufnahme.rec.stop(); }
  catch(e){ audioAufraeumen(); }
}
function audioAufraeumen(){
  if(!aufnahme) return;
  clearInterval(aufnahme.timer);
  try{ aufnahme.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  aufnahme=null;
}
/* fertig(o) bekommt {name, mime, dauer, data, ts} - oder nichts, wenn abgebrochen wurde. */
async function audioAufnahmeStarten(btn, fertig){
  const mime=audioMime();
  if(!mime || !navigator.mediaDevices){ toast("Aufnahme auf diesem Ger\u00e4t nicht m\u00f6glich."); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast("Kein Mikrofon-Zugriff."); return; }
  const chunks=[];
  const rec=new MediaRecorder(stream,{mimeType:mime, audioBitsPerSecond:32000});
  rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{
    const dauer=Math.round((Date.now()-aufnahme.start)/1000);
    const blob=new Blob(chunks,{type:mime});
    audioAufraeumen();
    const r=new FileReader();
    r.onload=()=>fertig({ mime, dauer, data:r.result, ts:Date.now(),
      endung:(mime.indexOf("mp4")>=0?"m4a":"webm") });
    r.readAsDataURL(blob);
  };
  aufnahme={rec, stream, chunks, start:Date.now(), timer:null};
  rec.start();
  const mal=()=>{
    const sk=Math.round((Date.now()-aufnahme.start)/1000);
    if(btn) btn.innerHTML=ico("stop")+"Stop ("+Math.floor(sk/60)+":"+String(sk%60).padStart(2,"0")+")";
    if(sk>=AUDIO_MAX_S) audioStoppen();
  };
  aufnahme.timer=setInterval(mal,500); mal();
}

function portalAngemeldet(){ const s=portalSession(); return !!(s && s.access_token && (s.expires_at||0)>Date.now()); }
async function portalAnmelden(email, passwort){
  const r=await fetch(PORTAL.url+"/auth/v1/token?grant_type=password", {
    method:"POST", headers:{apikey:PORTAL.anon,"Content-Type":"application/json"},
    body:JSON.stringify({email, password:passwort})});
  if(!r.ok) throw new Error("Anmeldung fehlgeschlagen");
  const d=await r.json(); portalSessionSetzen(d); return d;
}
/* Upload mit Byte-Fortschritt. fetch() kann das nicht, XHR schon - und im Werk will man
   sehen, dass sich etwas bewegt, bevor man das Geraet weglegt. */
function xhrSenden(url, kopf, inhalt, aufFortschritt){
  return new Promise(fertig=>{
    const x=new XMLHttpRequest();
    x.open("POST", url, true);
    Object.keys(kopf).forEach(k=>x.setRequestHeader(k, kopf[k]));
    x.timeout=30000+Math.ceil(inhalt.length/1048576)*30000;
    x.upload.onprogress=e=>{ if(e.lengthComputable && aufFortschritt) aufFortschritt(e.loaded/e.total); };
    x.onload=()=>{
      if(x.status>=200 && x.status<300) fertig("ok");
      else if(x.status===401 || x.status===403) fertig("kein-login");
      else fertig("unbestaetigt");
    };
    x.onerror=()=>fertig("unbestaetigt");
    x.ontimeout=()=>fertig("unbestaetigt");
    x.send(inhalt);
  });
}
async function portalRohVersuch(inhalt, name, aufFortschritt){
  if(!portalAngemeldet()) return "kein-login";
  const s=portalSession();
  return xhrSenden(PORTAL.url+"/storage/v1/object/"+PORTAL.bucket+"/"+encodeURI(ROHPFAD+"/"+name),
    {apikey:PORTAL.anon, Authorization:"Bearer "+s.access_token,
     "Content-Type":"application/json", "x-upsert":"true"},
    inhalt, aufFortschritt);
}
/* Bis zu drei Anlaeufe. Grund (Begehung 20.08.2026): Von fuenf Maschinen kam genau EINE an -
   im Werk reisst die Mobilfunkverbindung bei mehreren MB regelmaessig ab. Der Upload ist
   idempotent (x-upsert auf denselben Dateinamen), Wiederholen kann nichts doppeln. */
async function portalRohSenden(inhalt, name, melde){
  let letzte="unbestaetigt";
  for(let versuch=1; versuch<=3; versuch++){
    letzte=await portalRohVersuch(inhalt, name, anteil=>{ if(melde) melde(anteil, versuch); });
    if(letzte==="ok" || letzte==="kein-login") return letzte;
    if(navigator.onLine===false) return letzte;
    if(melde) melde(0, versuch+1);
    await new Promise(r=>setTimeout(r, versuch*2000));
  }
  return letzte;
}
/* Anmeldung EINMAL erfragen, danach merkt sich das Geraet die Sitzung. Felder in voller
   Breite mit 16px - darunter zoomt iOS beim Antippen ungefragt hinein. */
function portalLoginPanel(danach){
  const s=portalSession();
  oeffnePanel("Beim Portal anmelden",
    '<div class="card"><p class="mini">Einmalig \u2013 danach merkt sich das Ger\u00e4t die Anmeldung. '+
    'Es sind deine OAK-Zugangsdaten f\u00fcr das Kundenportal.</p>'+
    '<label>E-Mail</label><input id="plMail" type="email" inputmode="email" autocapitalize="none" '+
    'autocorrect="off" value="'+esc((s&&s.email)||"")+'" placeholder="name@oak-engineering.de">'+
    '<label>Passwort</label><input id="plPw" type="password">'+
    '<button class="btn primary" id="plOk" style="width:100%;margin-top:11px">Anmelden</button>'+
    '<div class="hinweis" id="plInfo" style="margin-top:9px" hidden></div></div>');
  const info=document.getElementById("plInfo");
  document.getElementById("plOk").onclick=async()=>{
    const mail=(document.getElementById("plMail").value||"").trim();
    const pw=document.getElementById("plPw").value||"";
    if(!mail || !pw){ info.hidden=false; info.textContent="E-Mail und Passwort n\u00f6tig."; return; }
    info.hidden=false; info.textContent="Anmeldung l\u00e4uft \u2026";
    try{
      const d=await portalAnmelden(mail, pw);
      d.email=mail; portalSessionSetzen(d);
      toast("Angemeldet");
      if(danach) danach();
    }catch(e){ info.textContent="Anmeldung fehlgeschlagen. E-Mail oder Passwort pr\u00fcfen."; }
  };
}
/* Der Dateiname traegt Kunde und Gegenstand, damit auditbericht_generieren.py am PC beides
   ohne Nachfrage kennt - dasselbe Muster wie Begehung_<kunde>__<maschine>_<datum>.json. */
function auditDateiname(a){
  return "Audit_"+slug(a.kunde||"ohne-kunde")+"__"+slug(a.gegenstand||a.standort||"audit")+
         "_"+(a.angelegt||heute())+".json";
}
/* Die aufgeloesten Klartexte wandern MIT ins Paket. Sonst muesste das PC-Tool die Tabellen
   DISZIPLINEN, AUDITARTEN und BEWERTKRIT nachbauen - zwei Wahrheiten fuer dieselbe Sache, und
   die zweite veraltet still. Ausserdem ist die Datei damit als Nachweis aus sich heraus
   lesbar, auch in fuenf Jahren ohne dieses Tool. */
function klartextFuer(a){
  const dz=DISZIPLINEN[a.disziplin||"umwelt"]||DISZIPLINEN.umwelt;
  const fr=fragenFuer(a);
  const krit={};
  (a.feststellungen||[]).forEach(f=>{
    krit[f.id]=BEWERTKRIT.filter(k=>(f.kriterien||{})[k[0]]).map(k=>k[1]);
  });
  return {
    disziplin: dz.name,
    regelwerk: (a.disziplin||"umwelt")==="umwelt"
      ? "ISO 14001:"+(a.normfassung||"2026")+(a.modus==="emas"?" + EMAS (Anhang I\u2013IV)":"")
      : dz.norm,
    auditart: (AUDITARTEN[a.auditart||"system"]||{}).name||"",
    rechtsbereiche: bereicheAktiv(a).map(b=>b[1]).join(", "),
    stichprobe: fr.filter(f=>istBearbeitet(a,f)).length+" von "+fr.length+
      " Pr\u00fcfpunkten der Arbeitsliste, ausgew\u00e4hlt aus einem Katalog von "+katalogFuer(a).length+".",
    kriterien: krit
  };
}
function auditPaket(a){
  return { _typ:"OAK-Audit", _version:1, fassung:APP_FASSUNG, exportiert:new Date().toISOString(),
           programm:S.programm, audit:a, klartext:klartextFuer(a) };
}
async function auditInsPortal(a, statusEl){
  const name=auditDateiname(a);
  const inhalt=JSON.stringify(auditPaket(a));
  const mb=(inhalt.length/1048576).toFixed(1);
  const zeig=(txt)=>{ if(statusEl){ statusEl.hidden=false; statusEl.innerHTML=txt; } };
  zeig("Sende "+mb+" MB \u2026");
  const erg=await portalRohSenden(inhalt, name, (anteil, versuch)=>
    zeig("Sende "+mb+" MB \u2013 "+Math.round(anteil*100)+" %"+(versuch>1?" (Versuch "+versuch+")":"")));
  if(erg==="ok"){
    a._gesendet=new Date().toISOString(); await sichern();
    zeig("<b>Angekommen.</b> "+esc(name)+"<br><span class=\"mini\">Liegt im Portal-Rohordner. "+
         "Abholen am PC: <code>python tools/begehungen_holen.py --holen --kunde &lt;slug&gt;</code></span>");
    return "ok";
  }
  if(erg==="kein-login"){
    zeig("Nicht angemeldet \u2013 Anmeldung wird ge\u00f6ffnet \u2026");
    portalLoginPanel(()=>exportPanel(a));
    return erg;
  }
  zeig("<b>Nicht best\u00e4tigt.</b> Die Datei ist <i>nicht</i> sicher angekommen. "+
       "Lade sie als Datei herunter und sende sie sp\u00e4ter \u2013 nichts geht verloren.");
  return erg;
}

/* ===== Disziplinen =====
   Die drei Normen folgen derselben harmonisierten Struktur (Kap. 4-10). Deshalb laesst sich
   ein Pruefpunkt einer Disziplin zuordnen ODER als "gemeinsam" fuehren - und im kombinierten
   Audit werden die gemeinsamen Elemente nur EINMAL geprueft. Genau das ist der Sinn des
   kombinierten Audits; wird der Umfang dabei nicht angepasst, wird eine Disziplin nur
   formal abgehandelt. */
const DISZIPLINEN = {
  umwelt:       { name:"Umwelt", norm:"ISO 14001", normId:"14001:2026",
                  recht:["wasser","immission","abfall","gefahrstoff"] },
  arbeitsschutz:{ name:"Arbeitssicherheit", norm:"ISO 45001", normId:"45001:2026",
                  recht:["gefahrstoff"] },
  energie:      { name:"Energie", norm:"ISO 50001", normId:"50001:2018",
                  recht:["energie"] },
  kombiniert:   { name:"Kombiniert", norm:"ISO 14001 + 45001 + 50001", normId:"14001:2026",
                  recht:["wasser","immission","abfall","gefahrstoff","energie"] }
};
/* Abschnitte, deren Nummer sich zwischen ISO 14001:2015 und :2026 unterscheidet.
   Waehrend der dreijaehrigen Uebergangsfrist sind Kunden noch nach 2015 zertifiziert -
   der Bericht muss dann die Nummer zitieren, die in DEREN Auditkriterium steht. */
const NORMFASSUNG_2015 = { "10.1":"10.3", "6.1.5":"6.1.4", "6.3":"8.1" };

/* ===== Auditarten =====
   Quelle: Foliensatz Modul 2, "Checkliste je Auditart" - im Teilnehmerskript nicht enthalten.
   Die Auditart bestimmt, WONACH die Checkliste gegliedert ist und welcher Fragentyp traegt.
   Systemaudit ist der Standardfall; die uebrigen Arten schneiden dieselben Pruefpunkte anders zu. */
const AUDITARTEN = {
  system:{ name:"Systemaudit",
    gliederung:"Entlang der Normabschnitte 4 bis 10 der ISO 14001",
    fragentyp:"Breit, auf Regelungen und deren Wirksamkeit gerichtet",

    gliederung:"Entlang des Prozessverlaufs von der Eingabe bis zum Ergebnis, über Bereichsgrenzen hinweg",
    fragentyp:"Auf Schnittstellen, Übergaben und Wechselwirkungen gerichtet",
    sortier:"turtle" },
  verfahren:{ name:"Verfahrensaudit",
    gliederung:"Entlang der Verfahrensanweisung Schritt für Schritt",

    sortier:"kette" }
};

/* ===== Fragenkatalog =====
   Zwei Ebenen, und die Unterscheidung ist der Kern des Werkzeugs:
   katalogFuer(a) = der ganze Vorrat (nachschlagen, Punkte ergaenzen)
   fragenFuer(a)  = die ARBEITSLISTE des Audittages, also die Stichprobe.
   Ein Audit prueft nicht alles - es prueft eine begruendete Auswahl. Wer 170 Punkte
   abarbeitet, fuehrt kein Audit, sondern eine Inventur. */
function katalogFuer(a){
  if(!a) return [];
  let fr = AUDIT_FRAGEN.filter(f => a.modus==="emas" ? true : f.regelwerk!=="emas");
  /* Disziplin: gemeinsame Punkte gelten immer, fachspezifische nur fuer ihre Disziplin.
     Im kombinierten Audit zaehlt der gemeinsame Punkt EINMAL - deshalb kein Duplizieren. */
  const d = a.disziplin || "umwelt";
  if(d!=="kombiniert"){
    fr = fr.filter(f => !f.disziplin || f.disziplin==="gemeinsam" || f.disziplin===d);
  }
  const art = AUDITARTEN[a.auditart||"system"];
  /* Compliance-Audit: nach Rechtsgebieten statt nach Normabschnitten - die rechtsbezogenen
     Pruefpunkte zuerst, der Rest bleibt erreichbar (Skript: die Liste darf den Blick nicht verstellen). */
  if(art && art.sortier==="recht"){
    const rechtlich = f => /recht|verpflicht|genehmig|auflage|compliance|abfall|wasser|gefahrstoff|emission/i
      .test(f.frage+" "+f.bezug+" "+f.nachweis+" "+f.kapitel);
    fr = fr.slice().sort((x,y)=> (rechtlich(y)?1:0)-(rechtlich(x)?1:0));
  }
  /* Prozess- und Lieferantenaudit: Schnittstellen und Steuerung ausgegliederter Prozesse nach vorn */
  if(art && (art.sortier==="turtle"||art.sortier==="kette")){
    const wort = art.sortier==="turtle"
      ? /schnittstelle|übergab|prozess|steuerung|ablauf|wechselwirk/i
      : /lieferant|auftragnehm|ausgegliedert|beschaffung|lebensweg|fremdfirm/i;
    fr = fr.slice().sort((x,y)=>
      (wort.test(y.frage+y.nachweis)?1:0)-(wort.test(x.frage+x.nachweis)?1:0));
  }
  return fr;
}

/* Die Arbeitsliste: nur die ausgewaehlten Punkte, in Katalogreihenfolge.
   Solange nichts zusammengestellt wurde, ist die Liste leer - das Tool fuehrt dann
   zuerst zur Zusammenstellung, statt 170 Punkte anzubieten. */
function fragenFuer(a){
  if(!a) return [];
  const k = katalogFuer(a);
  if(!a.auswahl || !a.auswahl.length) return [];
  const w = new Set(a.auswahl);
  return k.filter(f => w.has(f.nr));
}
function kapitelListe(a){
  const k=[]; fragenFuer(a).forEach(f=>{ if(!k.includes(f.kapitel)) k.push(f.kapitel); }); return k;
}

/* ===== Stichprobe zusammenstellen =====
   Gewicht je Kapitel: wo die Umweltwirkung und die Rechtsfolge sitzen, wird tiefer
   geprueft (Skript 2.3, risikobasierte Auditplanung). Die Zahlen sind ein Vorschlag,
   kein Automatismus - der Auditor bestimmt die Stichprobe. */
const KAPITEL_GEWICHT = [
  [/Kapitel 4/, 0.8], [/Kapitel 5/, 0.8], [/Kapitel 6 /, 1.4],
  [/Vertiefung 6\.1\.3/, 1.5], [/Kapitel 7/, 0.9], [/Kapitel 8 /, 1.5],
  [/Vertiefung 8\.1/, 1.0], [/Kapitel 9 /, 1.2], [/Vertiefung 9\.2/, 0.5],
  [/Kapitel 10/, 0.9], [/^E[1-7]/, 1.0]
];
function gewicht(kapitel, a){
  let g = 1;
  for(const [re,w] of KAPITEL_GEWICHT) if(re.test(kapitel)) { g = w; break; }
  /* Rechtsgebiets-Vertiefungen zaehlen nur, wenn der Bereich am Standort einschlaegig ist.
     Ganz ausblenden waere falsch - der Auditor kann jederzeit nachladen. */
  if(a && /Vertiefung 6\.1\.3/.test(kapitel) && !(a.rechtsbereiche||{}).wasser) g *= 0.2;
  if(a && /Vertiefung 8\.1/.test(kapitel) && !(a.rechtsbereiche||{}).energie) g *= 0.6;
  return g;
}
/* Verteilt das Ziel auf die Kapitel und zieht je Kapitel gestreut - nicht die ersten n,
   sonst wird immer derselbe Anfang geprueft. Die Runde verschiebt den Startpunkt,
   damit "Vorschlag neu" eine andere, ebenso begruendete Auswahl liefert. */
function vorschlagAuswahl(a, ziel, runde){
  const k = katalogFuer(a);
  const kapitel = [];
  k.forEach(f=>{ if(!kapitel.includes(f.kapitel)) kapitel.push(f.kapitel); });
  const punkte = kapitel.map(kp=>{
    const fr = k.filter(f=>f.kapitel===kp);
    return {kp, fr, roh: fr.length * gewicht(kp, a)};
  });
  const summe = punkte.reduce((s,x)=>s+x.roh,0) || 1;
  const auswahl = [];
  punkte.forEach(x=>{
    let n = Math.max(1, Math.round(ziel * x.roh / summe));
    n = Math.min(n, x.fr.length);
    const schritt = x.fr.length / n;
    const versatz = (runde||0) % Math.max(1, Math.ceil(schritt));
    for(let i=0;i<n;i++){
      const idx = Math.min(x.fr.length-1, Math.floor(i*schritt) + versatz);
      const nr = x.fr[idx].nr;
      if(!auswahl.includes(nr)) auswahl.push(nr);
    }
  });
  return auswahl;
}
function pruefStand(a,f){ return (a.pruefungen&&a.pruefungen[f.nr]) || null; }
function istBearbeitet(a,f){
  const p=pruefStand(a,f);
  if(p && (p.status==="ok"||p.status==="offen_punkt")) return true;
  return a.feststellungen.some(x=>x.quelle===f.nr);
}

/* ===== Panels ===== */
let panelZurueck=null;
function oeffnePanel(titel,html,beimSchliessen){
  document.getElementById("pnlTitel").textContent=titel;
  document.getElementById("pnlInhalt").innerHTML=html;
  document.getElementById("pnl").hidden=false;
  document.querySelector(".pnlbody").scrollTop=0;
  panelZurueck=beimSchliessen||null;
  if(!history.state || history.state.panel!==true) history.pushState({panel:true},"");
}
function panelSchliessen(){
  const p=document.getElementById("pnl"); if(p.hidden) return;
  /* Ein Mikrofon, das nach dem Schliessen weiterlaeuft, ist kein Schoenheitsfehler,
     sondern ein Datenschutzproblem - im Betrieb wird ringsum gesprochen. */
  if(typeof audioLaeuft==="function" && audioLaeuft()) audioStoppen();
  p.hidden=true;
  const fn=panelZurueck; panelZurueck=null;
  if(fn) fn(); else zeichne();
}
window.addEventListener("popstate",()=>{ if(!document.getElementById("pnl").hidden) panelSchliessen(); });
document.getElementById("pnlZu").addEventListener("click",()=>{
  if(history.state && history.state.panel) history.back(); else panelSchliessen();
});
document.getElementById("pnlZu").innerHTML=ico("zurueck")+"Zurück";
document.getElementById("btnLeitfaden").innerHTML=ico("info")+"Hilfe";
/* Die Nachschlagewerke haengen am Kopf, nicht an einem Reiter: sie werden waehrend
   des Gespraechs gebraucht, unabhaengig davon, wo man im Ablauf steht. */
function hilfePanel(){

/* Der rote Faden durch den Audittag. Sechs Schritte, jeder mit sichtbarem Stand -
   damit klar ist, wo man steht und was als Nächstes kommt (Leitlinie: das Tool stützt
   den roten Faden, es ersetzt ihn nicht). */
function ablaufSchritte(a){
  const ges=fragenFuer(a), fertig=ges.filter(f=>istBearbeitet(a,f)).length;
  const unt=Object.values(a.unterlagen||{}).filter(Boolean).length;
  const er=a.eroeffnung||{}, erPunkte=Object.values(er.punkte||{}).filter(Boolean).length;
  return [
    {id:"unterlagen", nr:"1", name:"Unterlagen anfordern",
     stand: unt? unt+" von "+UNTERLAGEN.length+" angefordert" : "offen", fertig: unt>0},
    {id:"recht", nr:"2", name:"Rechtsbereiche festlegen",
     stand: bereicheAktiv(a).length? bereicheAktiv(a).map(b=>b[1]).join(" · ") : "offen – steuert die Checkliste",
     fertig: bereicheAktiv(a).length>0},
    {id:"auswahl", nr:"3", name:"Checkliste zusammenstellen",
     stand: ges.length? ges.length+" Prüfpunkte gewählt" : "noch keine Auswahl – hier beginnen",
     fertig: ges.length>0},
    {id:"eroeffnung", nr:"4", name:"Eröffnungsbesprechung",
     stand: er.erledigt? "abgeschlossen"+(er.zeit?" "+er.zeit:"") : (erPunkte? erPunkte+" von "+EROEFFNUNG.length+" Punkten":"offen"),
     fertig: !!er.erledigt},
    {id:"pruefen", nr:"5", name:"Prüfen",
     stand: ges.length? fertig+" von "+ges.length+" bearbeitet · "+a.feststellungen.length+" Feststellungen · "+
            ((a.staerken||[]).length)+" Stärken" : "wartet auf die Checkliste",
     fertig: ges.length>0 && fertig>=ges.length},
    {id:"abschluss", nr:"6", name:"Abschlussbesprechung",
     stand: a.ablauf&&a.ablauf.abschluss? "abgeschlossen" : "keine neuen Feststellungen",
     fertig: !!(a.ablauf&&a.ablauf.abschluss)},
    {id:"export", nr:"7", name:"Export für den Bericht",
     stand: a.ablauf&&a.ablauf.export? "exportiert" : "JSON und Textentwurf",
     fertig: !!(a.ablauf&&a.ablauf.export)}
  ];
}
function planAnsicht(a){

      '<div class="t2">'+esc(sc.stand)+'</div></div>'+ico("chev","chev")+'</div>';
  });
  s+='</div>';

  s+='<div class="card"><h3>Fortschritt</h3>'+
    (ges.length
      ? '<div class="balken"><i style="width:'+proz+'%"></i></div>'+

    '</div>';

  s+='<div class="card"><h3>Auditrahmen (A2)</h3>'+

    fld("auftraggeber","Auditauftraggeber",a.auftraggeber)+
    fld("standort","Standort",a.standort)+
    fld("gegenstand","Auditgegenstand / Bereich",a.gegenstand)+
    '<label>Disziplin</label><select data-f="disziplin">'+
    Object.keys(DISZIPLINEN).map(k=>'<option value="'+k+'"'+((a.disziplin||"umwelt")===k?" selected":"")+'>'+
      esc(DISZIPLINEN[k].name)+' – '+esc(DISZIPLINEN[k].norm)+'</option>').join("")+'</select>'+
    ((a.disziplin==="kombiniert")
      ? '<div class="hinweis">Gemeinsame Elemente (Kontext, Führung, Kompetenz, Kommunikation, '+
        'Dokumentenlenkung, Notfallvorsorge, internes Audit, Managementbewertung, Nichtkonformität) '+
        'werden <b>einmal</b> geprüft. <b>Die Zeitplanung muss beide Disziplinen tragen</b> – wird der '+
        'Umfang nicht angepasst, wird eine Disziplin nur formal abgehandelt.</div>' : "")+
    ((a.disziplin||"umwelt")==="umwelt"
      ? '<label>Fassung der ISO 14001 (Auditkriterium beim Kunden)</label><select data-f="normfassung">'+
        [["2026","2026 – Neuausgabe"],["2015","2015 – noch in der Übergangsfrist"]].map(o=>
          '<option value="'+o[0]+'"'+((a.normfassung||"2026")===o[0]?" selected":"")+'>'+esc(o[1])+'</option>'
        ).join("")+'</select>' : "")+
    '<label>Auditart</label><select data-f="auditart">'+
    Object.keys(AUDITARTEN).map(k=>'<option value="'+k+'"'+((a.auditart||"system")===k?" selected":"")+'>'+
      esc(AUDITARTEN[k].name)+'</option>').join("")+'</select>'+
    '<div class="hinweis"><b>'+esc(AUDITARTEN[a.auditart||"system"].name)+':</b> '+
    esc(AUDITARTEN[a.auditart||"system"].gliederung)+'<br><i>Fragentyp: '+
    esc(AUDITARTEN[a.auditart||"system"].fragentyp)+'</i></div>'+
    ta("ziele","Auditziele",a.ziele)+
    ta("umfang","Auditumfang (Standorte, Prozesse, Zeitraum)",a.umfang)+
    ta("kriterien","Auditkriterien",a.kriterien)+
    '<div class="zwei">'+sel("methoden","Auditmethoden",a.methoden,["vor Ort","remote","hybrid"])+
    fld("berichtstermin","Berichtstermin",a.berichtstermin)+'</div>'+
    ta("team","Auditteam und Aufgabenverteilung",a.team)+
    '<div class="zwei">'+fld("sprache","Sprache",a.sprache)+fld("verteiler","Verteilerkreis",a.verteiler)+'</div>'+
    ta("zutritt","Zutritt, Sicherheit, Schutzausrüstung",a.zutritt)+
    ta("vertraulich","Vertraulichkeit",a.vertraulich)+
    tipp("eroeffnung")+'</div>';

  s+='<div class="card"><h3>Tagesplan (A2)</h3>'+
     '<p class="mini">Zeit · Bereich/Thema · Gesprächspartner · Auditkriterien · Auditor kommen aus der '+
     'Arbeitsvorlage des Skripts; Abteilung, Kostenstelle und Methode sind Ergänzungen für die Praxis.</p>';
  if(!a.termine.length) s+='<p class="leer">Noch keine Termine. Startvorlage anlegen oder einzeln ergänzen.</p>';
  a.termine.forEach((t,i)=>{
    const spanne = esc(t.zeit||"--:--")+(t.bis?"–"+esc(t.bis):"");
    const zweite = [t.abteilung, t.kst?"Kst. "+t.kst:"", t.partner, t.kriterien,
                    (t.methode&&t.methode!=="vor Ort")?t.methode:""].filter(Boolean).map(esc).join(" · ");
    s+='<div class="zeile" data-termin="'+i+'"><div class="txt">'+
      '<div class="t1">'+spanne+" · "+esc(t.thema||"(ohne Thema)")+'</div>'+
      '<div class="t2">'+(zweite||"—")+'</div></div>'+
      ico("chev","chev")+'</div>';
  });
  s+='<div class="zwei" style="margin-top:10px">'+
     '<button class="btn klein" id="btnTerminNeu">Termin ergänzen</button>'+
     '<button class="btn klein" id="btnVorlage">Startvorlage …</button></div>'+
     tipp("partner")+'</div>';
  s+=planWerkzeuge(a);

      a[el.dataset.f]=el.value;
      if(el.dataset.f==="auditart" || el.dataset.f==="disziplin" || el.dataset.f==="normfassung"){
        S.pruefIdx=0; await sichern(); zeichne(); return; }
      await sichern(); zeichneKopf();

    el.onclick=()=>terminBearbeiten(a, parseInt(el.dataset.termin,10));
  });
  document.querySelectorAll("[data-schritt]").forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.schritt;
      if(id==="unterlagen") return unterlagenPanel(a);
      if(id==="recht")      return rechtsbereichePanel(a);
      if(id==="auswahl")    return auswahlPanel(a);
      if(id==="eroeffnung") return eroeffnungPanel(a);
      if(id==="abschluss" || id==="export") return zumTab("bericht");
      zumTab("pruefen");
    };
  });
  nachPlanWerkzeuge(a);
  if(!fragenFuer(a).length) hauptKnopf("Checkliste zusammenstellen",()=>auswahlPanel(a));
  else if(!(a.eroeffnung||{}).erledigt) hauptKnopf("Eröffnungsbesprechung",()=>eroeffnungPanel(a));
  else hauptKnopf("Prüfpunkte öffnen",()=>zumTab("pruefen"));

   Zeit, Bereich/Thema, Gespraechspartner, Auditkriterien, Auditor.
   Endzeit, Abteilung, Kostenstelle und Methode sind Ergaenzungen aus der Praxis:
   die Methode ist je Abschnitt zu begruenden (ISO 19011:2026), die Kostenstelle
   ordnet den Termin der Organisation des Kunden zu. */
function terminBearbeiten(a,i){
  const neu = i<0;
  const t = neu ? {zeit:"",bis:"",thema:"",abteilung:"",kst:"",partner:"",kriterien:"",
                   methode:(a.methoden||"vor Ort"),auditor:""} : a.termine[i];
  oeffnePanel(neu?"Termin ergänzen":"Termin bearbeiten",
    '<div class="card">'+
    '<div class="zwei">'+fld("zeit","Beginn",t.zeit)+fld("bis","Ende",t.bis)+'</div>'+
    fld("thema","Bereich / Thema",t.thema)+
    '<div class="zwei">'+fld("abteilung","Abteilung",t.abteilung)+fld("kst","Kostenstelle",t.kst)+'</div>'+
    fld("partner","Gesprächspartner",t.partner)+
    fld("kriterien","Auditkriterien",t.kriterien)+
    '<div class="zwei">'+sel("methode","Methode",t.methode,["vor Ort","remote","hybrid"])+
    fld("auditor","Auditor",t.auditor)+'</div>'+
    '<div class="zwei" style="margin-top:12px">'+
    '<button class="btn primary" id="tOk">Übernehmen</button>'+
    (neu?"":'<button class="btn gefahr" id="tWeg">Löschen</button>')+'</div></div>');
  document.getElementById("tOk").onclick=async()=>{
    const v={}; document.querySelectorAll("#pnlInhalt [data-f]").forEach(el=>v[el.dataset.f]=el.value);
    if(neu) a.termine.push(v); else a.termine[i]=v;
    a.termine.sort((x,y)=>String(x.zeit).localeCompare(String(y.zeit)));
    await sichern(); panelSchliessen(); toast("Termin gespeichert");
  };
  const w=document.getElementById("tWeg");
  if(w) w.onclick=async()=>{ a.termine.splice(i,1); await sichern(); panelSchliessen(); toast("Termin gelöscht"); };
}

     '<p class="mini">Kriterium: <b>'+esc(abschnittFuer(a, f.bezug))+'</b>'+
     ((a.disziplin||"umwelt")==="umwelt"
        ? ' <span class="pill off">ISO 14001:'+esc(a.normfassung||"2026")+'</span>'
        : ' <span class="pill off">'+esc(DISZIPLINEN[a.disziplin].norm)+'</span>')+'</p>'+
     normBlock(a, f.bezug)+

     tipp("nachweis")+tipp("foto")+'</div>';

  s+='</div><div class="sp-rechts">';   /* rechte Spalte beginnt */
  s+='<div class="card"><h3>Stichprobe</h3>'+
     '<div class="zwei">'+fld("sGrund","Grundgesamtheit",(p.stichprobe||{}).grund)+

function nwTypName(t){ return ({dokument:"Dokument",aufzeichnung:"Aufzeichnung",beobachtung:"Beobachtung",
  hinweis:"Hinweis – Nachweis angefordert",fehlt:"nicht vorgelegt"}[t]||t||"—"); }

function nachPruef(a){
  const bl=document.getElementById("btnAwLeer");
  if(bl){ bl.onclick=()=>auswahlPanel(a); return; }
  const bn=document.getElementById("btnNachladen");
  if(bn) bn.onclick=()=>nachladenPanel(a);
  const bs=document.getElementById("btnStaerke");
  if(bs) bs.onclick=()=>staerkeBearbeiten(a,null,fragenFuer(a)[S.pruefIdx]);
  const fr=fragenFuer(a), f=fr[S.pruefIdx];
  if(!f) return;
  if(!a.pruefungen[f.nr]) a.pruefungen[f.nr]={stichprobe:{},nachweise:[],status:""};
  const p=a.pruefungen[f.nr];

  document.querySelectorAll("[data-f]").forEach(el=>el.addEventListener("change",async()=>{
    const k=el.dataset.f;
    if(k==="sGrund")  p.stichprobe.grund=el.value;
    if(k==="sRegel")  p.stichprobe.regel=el.value;
    if(k==="sUmfang") p.stichprobe.umfang=el.value;
    await sichern();
  }));
  document.querySelectorAll("[data-nwweg]").forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation(); p.nachweise.splice(parseInt(el.dataset.nwweg,10),1); await sichern(); zeichne();
  });
  document.getElementById("btnNw").onclick=()=>nachweisErfassen(a,f,p);
  document.getElementById("btnErw").onclick=async()=>{
    p.stichprobe.regel=(p.stichprobe.regel?p.stichprobe.regel+" | ":"")+
      "Umfang nach Abweichung erweitert am "+heute();
    await sichern(); toast("Erweiterung vermerkt"); zeichne();
  };
  document.getElementById("btnOk").onclick=async()=>{ p.status=p.status==="ok"?"":"ok"; await sichern(); zeichne(); };
  document.getElementById("btnOffen").onclick=async()=>{ p.status=p.status==="offen_punkt"?"":"offen_punkt"; await sichern(); zeichne(); };
  document.getElementById("btnZur").onclick=()=>{ S.pruefIdx=Math.max(0,S.pruefIdx-1); zeichne(); };
  document.getElementById("btnVor").onclick=()=>{ S.pruefIdx=Math.min(fr.length-1,S.pruefIdx+1); zeichne(); };
  document.getElementById("btnSprung").onclick=()=>kapitelSprung(a);
  hauptKnopf("Feststellung anlegen",()=>feststellungBearbeiten(a,null,f),"primary");
}

function feststellungBearbeiten(a,fs,quelle){
  const neu=!fs;
  if(neu){ fs=neueFeststellung(); fs.nr=a.feststellungen.length+1;
    if(quelle){ fs.quelle=quelle.nr; fs.anforderung=quelle.bezug; fs.bereich=quelle.kapitel; } }
  /* Einschlaegige Quellen zuerst - sie stammen aus den erfassten Rechtsbereichen. */
  const vorn=kuerzelAktiv(a);
  const sortiert=AUDIT_RECHTSQUELLEN.slice().sort((x,y)=>
    (vorn.includes(y.kuerzel)?1:0)-(vorn.includes(x.kuerzel)?1:0));
  const rqOpt=sortiert.map(r=>'<option'+(vorn.includes(r.kuerzel)?' class="vorn"':"")+'>'+
    esc(r.kuerzel)+'</option>').join("");
  oeffnePanel(neu?"Feststellung anlegen":"Feststellung Nr. "+fs.nr,
    '<div class="card"><h3>Teil 1 – im Audit</h3>'+
    fld("bereich","Bereich / Prozess",fs.bereich)+
    ta("anforderung","Anforderung (Normabschnitt, Rechtsvorschrift, interne Vorgabe)",fs.anforderung)+
    (quelle?normBlock(a, quelle.bezug):"")+
    (quelle&&normText(a, quelle.bezug)
      ? '<button class="btn klein" id="fsNorm" style="margin-top:8px;width:100%">'+ico("plus")+
        'Normabschnitt in die Anforderung übernehmen</button>' : "")+
    '<label>Rechtsquelle übernehmen</label><select id="rqWahl"><option value="">— wählen —</option>'+rqOpt+'</select>'+
    ta("nachweisText","Auditnachweis (Dokument, Version, Datum, Fundstelle, Beobachtung)",fs.nachweisText)+
    ta("abweichung","Abweichung (beschreibend, ohne Wertung, ohne Lösungsvorschlag)",fs.abweichung)+
    '<button class="btn klein" id="fsMuster" style="margin-top:8px;width:100%">'+ico("info")+
    'Formulierung prüfen – unbrauchbar und brauchbar</button>'+
    tipp("dreiklang")+'</div>'+

    /* Der fotografierte Nachweis gehoert unmittelbar an die Feststellung - nicht in einen
       Sammelordner, aus dem die Zuordnung spaeter erraten werden muesste. */
    '<div class="card"><h3>Nachweis in Bild und Ton</h3>'+
    '<p class="mini">Ein fotografierter Nachweis ist im Bericht belastbarer als eine '+
    'Beschreibung: Aushang, Register, Prüfbescheid, Anzeige, Kennzeichnung. Die Sprachnotiz '+
    'hältst du fest, solange das Gespräch frisch ist – ausformuliert wird am PC.</p>'+
    '<div id="fsMedien"></div>'+
    '<div class="zwei" style="margin-top:9px">'+
    '<button class="btn klein" id="fsFotoDok">'+ico("doc")+'Dokument'+'</button>'+
    '<button class="btn klein" id="fsFoto">'+ico("foto")+'Sachverhalt'+'</button></div>'+
    '<button class="btn klein" id="fsAudio" style="margin-top:8px;width:100%">'+ico("mikro")+
    'Sprachnotiz aufnehmen</button></div>'+

    /* Die Einstufung wird begruendet, nicht gewaehlt: erst die Kriterien, dann die Stufe. */
    '<div class="card"><h3>Einstufung begründen</h3>'+
    '<p class="mini">Welche Kriterien treffen zu? Die Stufe folgt daraus – und die Begründung nimmt '+
    '<b>Bezug auf den Nachweis</b>.</p>'+
    BEWERTKRIT.map(k=>'<label class="hak"><input type="checkbox" data-kr="'+k[0]+'"'+
      ((fs.kriterien||{})[k[0]]?" checked":"")+'><span><b>'+esc(k[1])+'</b>'+
      (k[3]==="kritisch"?' <span class="pill ka">i. d. R. kritisch</span>':"")+
      '<br><span class="mini">'+esc(k[2])+'</span></span></label>').join("")+
    '<div class="hinweis" id="fsVorschlag" style="margin-top:10px"></div>'+
    '<label>Bewertung</label><select data-f="bewertung">'+
    ["","K","N","KA","P"].map(o=>'<option value="'+o+'"'+(o===fs.bewertung?" selected":"")+'>'+
      (o?o+" – "+({K:"Konformität",N:"Nebenabweichung",KA:"kritische Abweichung",P:"Verbesserungspotenzial"}[o]):"— wählen —")+
      '</option>').join("")+'</select>'+
    ta("begruendung","Begründung der Einstufung (mit Bezug auf den Nachweis)",fs.begruendung)+
    '<button class="btn klein" id="fsBegr" style="margin-top:8px;width:100%">Begründung aus Kriterien und Nachweis formulieren</button>'+
    tipp("bewertung")+tipp("verzerrung")+'</div>'+

    '<div class="card"><h3>Teil 2 – Folgemaßnahmen</h3>'+
    '<p class="mini">Bleibt im Audit leer und wird beim <b>Folgeaudit</b> gefüllt – darüber läuft die '+
    'Wirksamkeitsprüfung. <i>Korrektur beseitigt den Sachverhalt, die Korrekturmaßnahme die Ursache.</i></p>'+
    ta("korrektur","Sofortmaßnahme / Korrektur",fs.korrektur)+
    ta("ursache","Ursache (Analyse durch die Organisation)",fs.ursache)+
    ta("massnahme","Korrekturmaßnahme",fs.massnahme)+
    '<div class="zwei">'+fld("verantwortlich","Verantwortlich",fs.verantwortlich)+fld("termin","Termin",fs.termin)+'</div>'+
    ta("wirkkriterium","Wirksamkeitskriterium (vorab festlegen!)",fs.wirkkriterium)+
    ta("wirkGeprueft","Wirksamkeit geprüft am / durch / Ergebnis",fs.wirkGeprueft)+'</div>'+

    '<div class="card"><div class="zwei">'+
    '<button class="btn primary" id="fsOk">Speichern</button>'+
    (neu?"":'<button class="btn gefahr" id="fsWeg">Löschen</button>')+'</div></div>');

  /* Vorschlag live nachfuehren */
  const kr=Object.assign({}, fs.kriterien||{});
  const zeigVorschlag=()=>{
    const v=stufeVorschlag(kr);
    const el=document.getElementById("fsVorschlag");
    el.innerHTML = v.stufe
      ? '<b>Vorschlag: '+v.stufe+'</b> – '+esc(v.text)
      : '<span class="mini">'+esc(v.text)+'</span>';
    if(v.stufe){
      const s=document.querySelector('#pnlInhalt [data-f="bewertung"]');
      if(s && !s.value) s.value=v.stufe;
    }
  };
  document.querySelectorAll("[data-kr]").forEach(el=>el.onchange=()=>{
    kr[el.dataset.kr]=el.checked; zeigVorschlag();
  });
  zeigVorschlag();

  /* Medien werden direkt an fs gehaengt. Bei einer NEUEN Feststellung liegt fs noch nicht im
     Audit - bricht man ab, sind Bild und Ton mit weg, genau wie die eingetippten Felder.
     Gezeichnet wird nur der Medienblock neu, nie das ganze Panel: sonst waeren die noch
     nicht gespeicherten Textfelder beim ersten Foto verloren. */
  const medienZeichnen=()=>{
    const el=document.getElementById("fsMedien"); if(!el) return;
    const fo=fs.fotos||[], au=fs.audios||[];
    if(!fo.length && !au.length){ el.innerHTML='<p class="mini">Noch kein Bild, keine Notiz.</p>'; return; }
    let h='';
    if(fo.length){
      h+='<div style="display:flex;flex-wrap:wrap;gap:7px">';
      fo.forEach((f,i)=>{
        h+='<div style="position:relative">'+
           '<img src="'+f.data+'" alt="" style="width:88px;height:88px;object-fit:cover;'+
           'border-radius:9px;border:1px solid var(--line)">'+
           '<span class="pill off" style="position:absolute;left:3px;bottom:3px;font-size:10px">'+
           esc(f.kat==="dokument"?"Dok":"Sache")+'</span>'+
           '<button class="btn klein gefahr" data-fotoweg="'+i+'" style="position:absolute;top:2px;'+
           'right:2px;padding:3px 5px;border-radius:7px;background:#fff">'+ico("muell")+'</button></div>';
      });
      h+='</div>';
    }
    au.forEach((a2,i)=>{
      h+='<div class="zeile" style="margin-top:7px"><div class="txt">'+
         '<div class="t1">'+ico("mikro")+' Sprachnotiz '+(i+1)+' \u00b7 '+dauerText(a2.dauer||0)+'</div>'+
         '<audio controls preload="none" src="'+a2.data+'" style="width:100%;margin-top:5px"></audio>'+
         '</div><button class="btn klein gefahr" data-audioweg="'+i+'">'+ico("muell")+'</button></div>';
    });
    el.innerHTML=h;
    el.querySelectorAll("[data-fotoweg]").forEach(b=>b.onclick=()=>{
      fs.fotos.splice(parseInt(b.dataset.fotoweg,10),1); medienZeichnen(); });
    el.querySelectorAll("[data-audioweg]").forEach(b=>b.onclick=()=>{
      fs.audios.splice(parseInt(b.dataset.audioweg,10),1); medienZeichnen(); });
  };
  const fotoDazu=(kat)=>fotoAufnehmen(kat, o=>{
    fs.fotos=fs.fotos||[];
    fs.fotos.push({ id:id(), kat:kat, name:o.name, data:o.data, ts:Date.now() });
    medienZeichnen(); toast(kat==="dokument"?"Dokument aufgenommen":"Foto aufgenommen");
  });
  document.getElementById("fsFotoDok").onclick=()=>fotoDazu("dokument");
  document.getElementById("fsFoto").onclick=()=>fotoDazu("sachverhalt");
  const bAu=document.getElementById("fsAudio");
  bAu.onclick=()=>{
    if(audioLaeuft()){ audioStoppen(); return; }
    audioAufnahmeStarten(bAu, o=>{
      fs.audios=fs.audios||[];
      fs.audios.push({ name:"feststellung-"+fs.nr+"-notiz-"+(fs.audios.length+1)+"."+o.endung,
        mime:o.mime, dauer:o.dauer, data:o.data, ts:o.ts });
      bAu.innerHTML=ico("mikro")+"Weitere Sprachnotiz";
      medienZeichnen(); toast("Sprachnotiz \u00fcbernommen");
    });
  };
  medienZeichnen();

  document.getElementById("fsBegr").onclick=()=>{
    const nwEl=document.querySelector('#pnlInhalt [data-f="nachweisText"]');
    const txt=begruendungBauen({nachweisText:nwEl?nwEl.value:""}, kr);
    if(!txt){ toast("Erst ein Kriterium wählen"); return; }
    const b=document.querySelector('#pnlInhalt [data-f="begruendung"]');
    b.value=txt; b.focus();
  };

  const bfn=document.getElementById("fsNorm");
  if(bfn) bfn.onclick=()=>{
    const w=normText(a, quelle.bezug);
    if(!w) return;
    const el=document.querySelector('#pnlInhalt [data-f="anforderung"]');
    const nr=abschnittFuer(a, quelle.bezug);
    const fassung=((a.disziplin||"umwelt")==="umwelt") ? "14001:"+(a.normfassung||"2026") : w.norm;
    const zitat="ISO "+fassung+", "+nr+" – "+w.titel;
    el.value=(el.value&&el.value.trim())?el.value.trim()+" · "+zitat:zitat;
    toast("Normabschnitt übernommen");
  };

  document.getElementById("fsMuster").onclick=()=>{
    oeffnePanel("Feststellungen: unbrauchbar und brauchbar",
      '<div class="card"><p class="mini">Vier Fehlerarten und wie es stattdessen heißt '+
      '(Folie Modul 3, S. 29). Merkmale der brauchbaren Sätze: <b>benannte Anforderung mit Stand</b> · '+
      '<b>Nachweis mit Fundstelle</b> · <b>Zeit- und Ortsbezug</b> · <b>Anteil statt Pauschale</b> · '+
      'kein Werturteil, keine Empfehlung.</p></div>'+
      FORMULIERUNG.map(f=>'<div class="card"><p class="krit-x"><b>Unbrauchbar:</b> '+esc(f[0])+'</p>'+
        '<p class="mini">'+esc(f[1])+'</p>'+
        '<div class="hinweis"><b>Brauchbar:</b> '+esc(f[2])+'</div></div>').join(""),
      ()=>{});
  };

  document.getElementById("rqWahl").onchange=(e)=>{
    if(!e.target.value) return;
    const ta=document.querySelector('#pnlInhalt [data-f="anforderung"]');
    const r=AUDIT_RECHTSQUELLEN.find(x=>x.kuerzel===e.target.value);
    ta.value=(ta.value?ta.value+" · ":"")+e.target.value+(r?" ("+r.stand+")":"");
  };
  document.getElementById("fsOk").onclick=async()=>{
    const v={}; document.querySelectorAll("#pnlInhalt [data-f]").forEach(el=>v[el.dataset.f]=el.value);
    /* Dreiklang erzwingen: ohne Anforderung und ohne Nachweis ist die Feststellung nicht belastbar */
    if(!v.anforderung || !v.anforderung.trim()){ toast("Anforderung fehlt – ohne Kriterium keine Feststellung"); return; }
    if(!v.nachweisText || !v.nachweisText.trim()){ toast("Nachweis fehlt – eine Aussage genügt nicht"); return; }
    if(!v.abweichung || !v.abweichung.trim()){ toast("Abweichung fehlt"); return; }
    /* Eine Bewertung ohne Begruendung ist im Bericht nicht haltbar - die Einstufung muss
       an den Kriterien haengen und auf den Nachweis Bezug nehmen (Skript 3.4, S. 37). */
    if(v.bewertung && v.bewertung!=="K"){
      if(!Object.values(kr).some(Boolean)){
        toast("Kein Kriterium gewählt – die Einstufung ist so nicht begründet"); return; }
      if(!v.begruendung || !v.begruendung.trim()){
        toast("Begründung fehlt – sie muss auf den Nachweis Bezug nehmen"); return; }
    }
    fs.kriterien=kr;
    Object.assign(fs,v);
    if(neu) a.feststellungen.push(fs);
    await sichern(); panelSchliessen(); toast("Feststellung gespeichert");
  };
  const w=document.getElementById("fsWeg");
  if(w) w.onclick=async()=>{
    a.feststellungen=a.feststellungen.filter(x=>x.id!==fs.id);
    a.feststellungen.forEach((x,i)=>x.nr=i+1);
    await sichern(); panelSchliessen(); toast("Feststellung gelöscht");
  };
}

/* ---------- Staerke erfassen ---------- */
function staerkeBearbeiten(a,st,quelle){
  if(!a.staerken) a.staerken=[];
  const neu=!st;
  if(neu){ st=neueStaerke(); st.nr=a.staerken.length+1;
    if(quelle){ st.quelle=quelle.nr; st.bereich=quelle.kapitel; } }
  oeffnePanel(neu?"Stärke festhalten":"Stärke Nr. "+st.nr,
    '<div class="card"><p class="mini">Was <b>nachweislich</b> gut funktioniert, gehört in den Bericht – '+
    'und in der Abschlussbesprechung <b>vor</b> die Abweichungen. Auch hier gilt: ohne Nachweis ist es Lob, '+
    'keine Feststellung.</p>'+
    fld("bereich","Bereich / Prozess",st.bereich)+
    ta("was","Was funktioniert gut – sachlich beschrieben",st.was)+
    ta("nachweis","Nachweis (Dokument, Aufzeichnung, Beobachtung mit Ort und Datum)",st.nachweis)+
    ta("uebertragbar","Auf welche Bereiche ließe sich das übertragen? (optional)",st.uebertragbar)+
    '<div class="zwei" style="margin-top:12px">'+
    '<button class="btn primary" id="stOk">Speichern</button>'+
    (neu?"":'<button class="btn gefahr" id="stWeg">Löschen</button>')+'</div></div>');
  document.getElementById("stOk").onclick=async()=>{
    const v={}; document.querySelectorAll("#pnlInhalt [data-f]").forEach(el=>v[el.dataset.f]=el.value);
    if(!v.was || !v.was.trim()){ toast("Beschreibung fehlt"); return; }
    if(!v.nachweis || !v.nachweis.trim()){ toast("Nachweis fehlt – ohne ihn bleibt es Lob"); return; }
    Object.assign(st,v);
    if(neu) a.staerken.push(st);
    await sichern(); panelSchliessen(); toast("Stärke festgehalten");
  };
  const w=document.getElementById("stWeg");
  if(w) w.onclick=async()=>{
    a.staerken=a.staerken.filter(x=>x.id!==st.id);
    a.staerken.forEach((x,i)=>x.nr=i+1);
    await sichern(); panelSchliessen(); toast("Stärke gelöscht");
  };
}

/* ---------- Tab Bericht ----------
   Alles, was nach dem letzten Pruefpunkt kommt: Abschlussbesprechung, Massnahmenuebersicht (A6),
   Selbstcheck und Export. Der frueherer Sammelreiter "Mehr" entfaellt - Werkzeuge ohne Ablaufbezug
   haengen jetzt am Hilfe-Knopf im Kopf, Programm und Auditverwaltung in der Planung. */
/* Die sechs Pflichtinhalte des Auditberichts (Skript 3.6, S. 38 f.) als PRUEFUNG, nicht als
   Merkzettel: jede Zeile weiss, woran sie haengt, und meldet, was noch fehlt. */
function berichtPflicht(a){
  const fr=fragenFuer(a);
  const fsOk=a.feststellungen.length
    ? a.feststellungen.every(f=>f.anforderung && f.nachweisText && (f.bewertung==="K" || f.begruendung))
    : false;
  return [
    ["Auditziele, Umfang und Kriterien", !!(a.ziele && a.umfang && a.kriterien), "Auditrahmen in der Planung"],
    ["Auftraggeber, Organisation, Auditteam mit Rollen", !!(a.auftraggeber && a.kunde && a.team), "Auditrahmen in der Planung"],
    ["Termine und Orte, einschließlich Remote-Anteilen", !!(a.termine.length && a.standort), "Tagesplan in der Planung"],
    ["Feststellungen mit Nachweisen und Bewertung", fsOk, "Tab Befunde – je Feststellung Anforderung, Nachweis, Begründung"],
    ["Schlussfolgerung zu Erfüllung und Wirksamkeit", !!a.schlussfolgerung, "unten auf dieser Seite"],
    ["Erklärung zum Erfüllungsgrad der Auditkriterien", !!a.erfuellung, "unten auf dieser Seite"]
  ];
}

function berichtAnsicht(a){
  const fr=fragenFuer(a), fertig=fr.filter(f=>istBearbeitet(a,f)).length;
  const z=(b)=>a.feststellungen.filter(f=>f.bewertung===b).length;

    '<p><span class="pill ka">KA '+z("KA")+'</span><span class="pill n">N '+z("N")+'</span>'+
    '<span class="pill p">P '+z("P")+'</span><span class="pill k">K '+z("K")+'</span>'+
    '<span class="pill off">Stärken '+((a.staerken||[]).length)+'</span></p>'+
    '<p class="mini">'+fertig+' von '+fr.length+' Prüfpunkten der Arbeitsliste bearbeitet</p></div>';

  /* Pflichtinhalte */
  s+='<div class="card"><h3>Pflichtinhalte'+(fehlt.length?' – '+fehlt.length+' offen':' – vollständig')+'</h3>'+
    pflicht.map(x=>'<div class="zeile"><div class="txt">'+
      '<div class="t1">'+(x[1]?ico("haken"):'<span class="fehlt">•</span>')+' '+esc(x[0])+'</div>'+
      (x[1]?"":'<div class="t2 fehlt">fehlt – '+esc(x[2])+'</div>')+'</div></div>').join("")+
    '<p class="mini" style="margin-top:9px">Ergänzend, soweit vereinbart: Auditplan mit Teilnehmerliste · '+
    'nicht abgedeckte Bereiche mit Gründen'+(ab.nichtAbgedeckt?" ✓":"")+' · ungelöste Meinungsverschiedenheiten'+
    ((ab.rueckmeldungen||[]).some(r=>/abweichende/i.test(r.umgang||""))?" ✓":"")+' · Potenziale und Empfehlungen · '+
    'Folgemaßnahmen mit Verantwortlichen und Terminen · Vertraulichkeit und Verteilerkreis'+
    ((a.vertraulich||a.verteiler)?" ✓":"")+'</p></div>';

  /* Schlussfolgerungen - die beiden fehlenden Pflichtangaben */
  s+='<div class="card"><h3>Schlussfolgerungen</h3>'+
    ta("schlussfolgerung","Aussage zur Erfüllung der Auditkriterien und zur Wirksamkeit des Systems",a.schlussfolgerung)+
    ta("erfuellung","In welchem Umfang wurden die Auditkriterien erfüllt?",a.erfuellung)+
    '<div class="zwei">'+fld("berichtsdatum","Berichtsdatum",a.berichtsdatum)+
    fld("verteiler2","Verteilerkreis",a.verteiler)+'</div></div>';

  /* Gliederung mit Stand je Abschnitt */
  const g=[
    ["1 Deckblatt","Organisation, Bereich, Audittermin, Auditteam, Berichtsdatum, Vertraulichkeitsvermerk",
     !!(a.kunde&&a.team&&a.berichtsdatum)],
    ["2 Zusammenfassung","Gesamtbild auf höchstens einer Seite: Systemwirksamkeit, Anzahl und Art der Feststellungen",
     !!a.schlussfolgerung],
    ["3 Auditgrundlagen","Ziele, Umfang, Kriterien, Methoden, Einschränkungen, Stichprobenumfang",
     !!(a.ziele&&a.kriterien)],
    ["4 Ablauf","Auditplan, Gesprächspartner, besuchte Bereiche, Remote-Anteile", a.termine.length>0],
    ["5 Feststellungen","je Feststellung Anforderung, Nachweis, Bewertung", a.feststellungen.length>0],
    ["6 Stärken und Potenziale","was nachweislich gut funktioniert", (a.staerken||[]).length>0],
    ["7 Schlussfolgerungen","Erfüllung der Auditkriterien und Wirksamkeit", !!a.erfuellung],
    ["8 Maßnahmenübersicht","Feststellung, Maßnahme, Verantwortlicher, Termin, Status (A6)",
     a.feststellungen.some(f=>f.massnahme)],
    ["9 Anlagen","Auditplan, ausgefüllte Checklisten, Nachweisverzeichnis, Fotodokumentation", true]
  ];
  s+='<div class="card"><h3>Gliederung des Berichts</h3>'+
    g.map(x=>'<div class="zeile"><div class="txt"><div class="t1">'+(x[2]?ico("haken"):'<span class="fehlt">•</span>')+
      ' '+esc(x[0])+'</div><div class="t2">'+esc(x[1])+'</div></div></div>').join("")+
    '<p class="mini" style="margin-top:9px">Sprachlich: sachlich und beschreibend, ohne Wertung von Personen. '+
    'Belege mit Dokument, Version, Datum und Fundstelle. <b>Empfehlungen stehen nicht im Feststellungstext.</b> '+
    'Frist im internen Audit üblich: zehn Arbeitstage.</p></div>';

  s+='<div class="card"><h3>Schritte</h3>'+
    '<div class="zeile" id="bAbschluss"><div class="txt"><div class="t1">Abschlussbesprechung</div>'+
    '<div class="t2">'+((a.ablauf&&a.ablauf.abschluss)?"abgeschlossen":"Stärken zuerst – keine neuen Feststellungen")+'</div></div>'+ico("chev","chev")+'</div>'+
    '<div class="zeile" id="bMass"><div class="txt"><div class="t1">Maßnahmenübersicht (A6)</div>'+
    '<div class="t2">Feststellung, Maßnahme, Verantwortlicher, Termin, Status</div></div>'+ico("chev","chev")+'</div>'+
    '<div class="zeile" id="bBeob"><div class="txt"><div class="t1">Eigene Gesprächsführung (B1)</div>'+
    '<div class="t2">Selbstcheck nach dem Audit</div></div>'+ico("chev","chev")+'</div>'+
    '<div class="zeile" id="bExport"><div class="txt"><div class="t1">Export</div>'+
    '<div class="t2">JSON und Berichtsentwurf nach dieser Gliederung</div></div>'+ico("chev","chev")+'</div></div>';
  return s;
}

/* Auditverwaltung und Programm - sie gehoeren zur Planung, nicht in einen Sammelreiter. */
function planWerkzeuge(a){
  let s='<div class="card"><h3>Audit und Programm</h3>'+
    '<div class="zeile" id="pProgramm"><div class="txt"><div class="t1">Auditprogramm (A1)</div>'+
    '<div class="t2">Mehrjahresmatrix mit Aufwandsrechner</div></div>'+ico("chev","chev")+'</div>'+
    (a.modus==="emas"?'<div class="zeile" id="pA5"><div class="txt"><div class="t1">Prüfprogramm EMAS (A5)</div>'+
    '<div class="t2">Anhang III – vier Pflichtangaben</div></div>'+ico("chev","chev")+'</div>':"")+
    '<label>Regelwerk</label><select data-f="modus">'+
    ["ISO 14001","EMAS (ISO 14001 + Anhang I–IV)"].map(o=>'<option'+
      ((a.modus==="emas"?"EMAS (ISO 14001 + Anhang I–IV)":"ISO 14001")===o?" selected":"")+'>'+esc(o)+'</option>').join("")+
    '</select><p class="mini">Vorrat im Katalog: ISO 14001 '+AUDIT_FRAGEN.filter(f=>f.regelwerk!=="emas").length+
    ' · EMAS zusätzlich '+AUDIT_FRAGEN.filter(f=>f.regelwerk==="emas").length+'</p></div>';

  /* Normpaket: liegt bewusst NICHT im Tool (Einzelplatzlizenz), sondern wird einmalig
     ins Geraet geladen. Ohne Paket funktioniert alles - nur der Wortlaut fehlt. */
  s+='<div class="card"><h3>Normtexte</h3>'+
    (normGeladen()
      ? '<p class="mini">Geladen: <b>'+Object.keys(NORM.normen).map(esc).join(" · ")+
        '</b><br>Stand '+esc(NORM.erzeugt||"—")+' · liegt nur auf diesem Gerät</p>'
      : '<p class="mini">Kein Normpaket geladen – im Audit erscheint dann nur die Abschnittsnummer, '+
        'nicht der Wortlaut. Paket erzeugen mit <code>python tools/normtexte_export.py</code>.</p>')+
    '<input type="file" id="normDatei" accept="application/json,.json" style="display:none">'+
    '<button class="btn klein" id="btnNorm" style="margin-top:9px">'+ico("doc")+
    (normGeladen()?'Normpaket ersetzen':'Normpaket laden')+'</button>'+
    (normGeladen()?'<button class="btn klein gefahr" id="btnNormWeg" style="margin-top:7px;width:100%">'+
      'Vom Gerät entfernen</button>':"")+
    '<p class="mini" style="margin-top:8px"><b>Einzelplatzlizenz.</b> Das Paket wird nicht '+
    'veröffentlicht und nicht weitergegeben.</p></div>';

  s+='<div class="card"><h3>Audits</h3>';
  S.audits.forEach(x=>{
    s+='<div class="zeile" data-aud="'+x.id+'"><div class="txt">'+
      '<div class="t1">'+esc(x.kunde||"ohne Kunde")+(x.id===S.aktiv?' <span class="pill">offen</span>':"")+'</div>'+
      '<div class="t2">'+esc(x.gegenstand||x.standort||"—")+' · '+x.feststellungen.length+' Feststellungen · '+esc(x.angelegt)+'</div>'+
      '</div>'+ico("chev","chev")+'</div>';
  });
  s+='<button class="btn klein" id="btnNeu" style="margin-top:9px">'+ico("plus")+'Neues Audit</button></div>';
  return s;
}
function nachPlanWerkzeuge(a){
  document.querySelectorAll("[data-aud]").forEach(el=>el.onclick=async()=>{
    S.aktiv=el.dataset.aud; S.pruefIdx=0; await sichern(); zumTab("plan");
  });
  const bn=document.getElementById("btnNeu");
  if(bn) bn.onclick=()=>auditAnlegen();
  const m=document.querySelector('[data-f="modus"]');
  if(m) m.onchange=async()=>{ a.modus=m.value.startsWith("EMAS")?"emas":"14001"; S.pruefIdx=0; await sichern(); zeichne(); };
  const bp=document.getElementById("pProgramm");
  if(bp) bp.onclick=()=>programmPanel();

  const bnorm=document.getElementById("btnNorm"), nd=document.getElementById("normDatei");
  if(bnorm && nd){
    bnorm.onclick=()=>nd.click();
    nd.onchange=async()=>{
      const datei=nd.files&&nd.files[0]; if(!datei) return;
      try{
        const roh=JSON.parse(await datei.text());
        if(!roh || !roh.normen) { toast("Das ist kein Normpaket"); return; }
        await put("normtexte", roh); NORM=roh;
        toast(Object.keys(roh.normen).length+" Normen geladen"); zeichne();
      }catch(e){ toast("Datei konnte nicht gelesen werden"); }
    };
  }
  const bnw=document.getElementById("btnNormWeg");
  if(bnw) bnw.onclick=async()=>{ await put("normtexte", null); NORM=null; toast("Normpaket entfernt"); zeichne(); };
  const b5=document.getElementById("pA5");
  if(b5) b5.onclick=()=>a5Panel(a);
}

async function auditAnlegen(){
  const a=neuesAudit(); S.audits.unshift(a); S.aktiv=a.id; S.pruefIdx=0; S.tab="plan";
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab==="plan"));
  await sichern(); zeichne(); toast("Audit angelegt");
}

/* ---------- A1: Auditprogramm mit Aufwandsrechner ---------- */
function programmPanel(){
  if(!S.programm) S.programm={ziele:"",risiken:"",verantwortlich:"",stand:heute(),zeilen:[]};
  const P=S.programm;
  const zeilen=P.zeilen.map((z,i)=>
    '<tr data-pz="'+i+'"><td>'+(i+1)+'</td><td>'+esc(z.bereich)+'</td><td>'+esc(z.ziel)+'</td>'+
    '<td>'+esc(z.kriterien)+'</td><td>'+esc(z.zeit)+'</td><td>'+esc(z.methode)+'</td>'+
    '<td>'+esc(z.dauer)+'</td><td>'+esc(z.team)+'</td></tr>').join("");

/* Kennzahlen berechnen, nicht auflisten - das Tool hat die Zahlen bereits (Skript 1.5, S. 19) */
function kennzahlenKarte(){
  const P=S.programm||{zeilen:[]};
  const geplant=P.zeilen.length;
  const durchgefuehrt=S.audits.filter(a=>a.feststellungen.length||Object.keys(a.pruefungen||{}).length).length;
  const bereiche=[...new Set(P.zeilen.map(z=>z.bereich).filter(Boolean))];
  const auditiert=[...new Set(S.audits.map(a=>a.gegenstand).filter(Boolean))];
  const abdeckung=bereiche.length?Math.round(auditiert.filter(x=>bereiche.includes(x)).length/bereiche.length*100):0;
  const fest=S.audits.reduce((s,a)=>s+a.feststellungen.length,0);
  const je=durchgefuehrt?(fest/durchgefuehrt).toFixed(1):"–";
  const offen=S.audits.reduce((s,a)=>s+a.feststellungen.filter(f=>(f.bewertung==="KA"||f.bewertung==="N")&&!f.wirkGeprueft).length,0);
  const z=(l,w,h)=>'<p style="margin-bottom:9px"><b style="font-size:18px">'+w+'</b> '+esc(l)+
    '<br><span class="mini">'+esc(h)+'</span></p>';
  return '<div class="card"><h3>Kennzahlen</h3>'+
    z("Programmerfüllung",durchgefuehrt+" / "+geplant,"Wird der Zyklus abgearbeitet?")+
    z("Abdeckungsgrad",abdeckung+" %","Zeigt blinde Flecken im Programm")+
    z("Feststellungen je Audit",je,"Vergleich über Bereiche und Zeit")+
    z("Maßnahmen ohne Wirksamkeitsnachweis",offen,"Wirksamkeit der Nachverfolgung")+
    '<div class="hinweis">Kennzahlen steuern das <b>Programm</b>. Zur Bewertung einzelner Bereiche oder '+
    'Auditoren genutzt, sinkt die Bereitschaft, Abweichungen offen zu benennen – dann verliert das '+
    'Programm genau die Information, für die es eingerichtet wurde.<br><br>'+
    'Die <b>Wiederholungsquote</b> – erneut festgestellte gleiche Abweichungen – ist die Kennzahl für die '+
    'Qualität der Ursachenanalyse. Sie entsteht erst mit dem zweiten Zyklus.</div></div>';
}
function programmZeile(i){
  const P=S.programm, neu=i<0;
  const z=neu?{bereich:"",ziel:"",kriterien:"",zeit:"",methode:"vor Ort",dauer:"1",team:""}:P.zeilen[i];
  oeffnePanel(neu?"Programmzeile":"Zeile bearbeiten",
    '<div class="card">'+
    fld("bereich","Bereich / Prozess",z.bereich)+
    ta("ziel","Auditziel",z.ziel)+
    fld("kriterien","Auditkriterien",z.kriterien)+
    '<div class="zwei">'+fld("zeit","Zeitfenster (z. B. KW 12)",z.zeit)+
    sel("methode","Methode",z.methode,["vor Ort","remote","hybrid"])+'</div>'+
    '<div class="zwei">'+fld("dauer","Dauer in Tagen",z.dauer)+fld("team","Auditteam",z.team)+'</div>'+
    '<div class="zwei" style="margin-top:12px">'+
    '<button class="btn primary" id="pzOk">Übernehmen</button>'+
    (neu?'':'<button class="btn gefahr" id="pzWeg">Löschen</button>')+
    (neu?'':'<button class="btn" id="pzAudit">Audit daraus anlegen</button>')+'</div></div>',
    ()=>programmPanel());
  document.getElementById("pzOk").onclick=async()=>{
    const v={}; document.querySelectorAll("#pnlInhalt [data-f]").forEach(el=>v[el.dataset.f]=el.value);
    if(neu) P.zeilen.push(v); else P.zeilen[i]=v;
    await sichern(); programmPanel(); toast("Zeile gespeichert");
  };
  const w=document.getElementById("pzWeg");
  if(w) w.onclick=async()=>{ P.zeilen.splice(i,1); await sichern(); programmPanel(); toast("Zeile gelöscht"); };
  const b=document.getElementById("pzAudit");
  if(b) b.onclick=async()=>{
    const a=neuesAudit({gegenstand:z.bereich, ziele:z.ziel, kriterien:z.kriterien, methoden:z.methode});
    S.audits.unshift(a); S.aktiv=a.id; S.pruefIdx=0; S.tab="plan";
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab==="plan"));
    await sichern(); panelSchliessen(); toast("Audit aus Programmzeile angelegt");
  };
}

/* ---------- Abschluss ---------- */
/* ---------- Abschlussbesprechung ----------
   Der Bildschirm folgt der Gliederung des Auditberichts - was hier besprochen wird, steht spaeter
   in derselben Reihenfolge im Bericht. Deshalb braucht es keine zweite Checkliste.
   Reihenfolge nach Skript 3.5, S. 38: Rueckschau, Stichprobenhinweis, Gesamtbild mit Staerken,
   DANN die Abweichungen, Rueckmeldungen aufnehmen, Ausblick.
   Verhandelt wird ueber Formulierung und Termin - nie ueber die Existenz einer Abweichung. */
const UMGANG = ["Formulierung angepasst","Sachverhalt korrigiert","abweichende Auffassung dokumentiert",
                "zur Prüfung mitgenommen","Hinweis aufgenommen"];

function abschlussPanel(a){
  if(!a.abschluss) a.abschluss={beginn:"",ende:"",teilnehmer:[],rueckmeldungen:[],nichtAbgedeckt:"",ausblick:""};
  const ab=a.abschluss;
  const fr=fragenFuer(a), fertig=fr.filter(f=>istBearbeitet(a,f)).length;
  const z=(b)=>a.feststellungen.filter(f=>f.bewertung===b).length;
  const offen=[]; fr.forEach(f=>{ const p=pruefStand(a,f); if(p&&p.status==="offen_punkt") offen.push(f); });
  const rang={KA:0,N:1,P:2,K:3,"":4};
  const sortiert=a.feststellungen.slice().sort((x,y)=>(rang[x.bewertung||""]-rang[y.bewertung||""])||(x.nr-y.nr));
  const st=a.staerken||[];
  const kopf=(n,txt)=>'<h3><b class="sn">'+n+'</b> '+txt+'</h3>';

  oeffnePanel("Abschlussbesprechung",
    /* Wer ist dabei */
    '<div class="card">'+kopf("W","Wer ist dabei")+
    '<div class="zwei">'+fld("abBeginn","Beginn",ab.beginn||jetztZeit())+fld("abEnde","Ende",ab.ende)+'</div>'+
    (ab.teilnehmer.length? ab.teilnehmer.map((x,i)=>'<div class="zeile" data-tn="'+i+'"><div class="txt">'+
      '<div class="t1">'+esc(x.name||"(ohne Namen)")+(x.ansprech?' <span class="pill">Ansprechpartner</span>':"")+'</div>'+
      '<div class="t2">'+esc(x.funktion||"—")+'</div></div>'+ico("chev","chev")+'</div>').join("")
      : '<p class="mini">Noch niemand erfasst.</p>')+
    '<button class="btn klein" id="abTnNeu" style="margin-top:9px">'+ico("plus")+'Teilnehmenden ergänzen</button></div>'+

    /* 1 Rueckschau und Stichprobe */
    '<div class="card">'+kopf("1","Rückschau und Stichprobe")+
    '<p class="mini">'+fertig+' von '+fr.length+' Prüfpunkten bearbeitet'+
    (fr.length?' ('+Math.round(fertig/fr.length*100)+' %)':"")+' · aus einem Katalog von '+katalogFuer(a).length+'</p>'+
    '<div class="hinweis"><b>Vorlesen:</b> Das Ergebnis stützt sich auf eine Stichprobe. '+
    'Ein Audit ohne Feststellungen ist kein Beleg für Fehlerfreiheit.</div>'+
    (offen.length?'<p class="mini" style="margin-top:8px"><b>'+offen.length+' offene Punkte</b> – Nachweis '+
      'angefordert, bis Auditende nicht vorgelegt: '+offen.map(f=>esc(f.nr)).join(", ")+'</p>':"")+'</div>'+

    /* 2 Staerken */
    '<div class="card">'+kopf("2","Stärken zuerst"+(st.length?" ("+st.length+")":""))+
    (st.length? st.map(x=>'<p style="margin-bottom:8px">'+esc(x.was)+
      '<br><span class="mini">'+esc([x.bereich,x.nachweis].filter(Boolean).join(" · "))+'</span></p>').join("")
      : '<p class="mini">Nichts festgehalten – das ist selten richtig. Was nachweislich gut läuft, '+
        'eröffnet die Besprechung und gehört in den Bericht.')+'</div>'+

    /* 3 Feststellungen */
    '<div class="card">'+kopf("3","Feststellungen")+
    '<p><span class="pill ka">KA '+z("KA")+'</span><span class="pill n">N '+z("N")+'</span>'+
    '<span class="pill p">P '+z("P")+'</span><span class="pill k">K '+z("K")+'</span></p>'+
    (sortiert.length? sortiert.map(f=>'<div class="zeile"><div class="txt">'+
      '<div class="t1"><span class="pill '+(f.bewertung||"off").toLowerCase()+'">'+esc(f.bewertung||"offen")+
      '</span> Nr. '+f.nr+' · '+esc(f.bereich||"—")+'</div>'+
      '<div class="t2">'+esc(f.abweichung||"(noch nicht formuliert)")+'</div>'+
      '<div class="t2"><b>Anforderung:</b> '+esc(f.anforderung||"—")+' · <b>Nachweis:</b> '+esc(f.nachweisText||"—")+'</div>'+
      (f.begruendung?'<div class="t2">'+esc(f.begruendung)+'</div>'
                    :'<div class="t2 fehlt">Begründung fehlt – so nicht vortragen</div>')+
      '</div></div>').join("") : '<p class="mini">Keine Feststellungen.</p>')+
    '<div class="hinweis" style="margin-top:9px"><b>Keine neuen Feststellungen.</b> Je Punkt: Anforderung, '+
    'Nachweis, Bewertung. Verhandelt wird über Formulierung und Termin – nie über die Existenz.</div></div>'+

    /* 4 Einschraenkungen */
    '<div class="card">'+kopf("4","Einschränkungen")+
    ta("abNichtAbgedeckt","Nicht abgedeckte Bereiche und Gründe",ab.nichtAbgedeckt)+'</div>'+

    /* 5 Rueckmeldungen */
    '<div class="card">'+kopf("5","Rückmeldungen"+(ab.rueckmeldungen.length?" ("+ab.rueckmeldungen.length+")":""))+
    '<p class="mini">Jede Bemerkung aufnehmen – auch die, der nicht gefolgt wird. '+
    '<b>Abweichende Auffassungen gehören in den Bericht.</b></p>'+
    (ab.rueckmeldungen.length? ab.rueckmeldungen.map((r,i)=>'<div class="zeile" data-rm="'+i+'"><div class="txt">'+
      '<div class="t1">'+esc(r.wer||"(ohne Namen)")+(r.bezug?' · '+esc(r.bezug):"")+'</div>'+
      '<div class="t2">'+esc(r.text||"")+'</div>'+
      '<div class="t2"><b>'+esc(r.umgang||"—")+'</b></div></div>'+ico("chev","chev")+'</div>').join("") : "")+
    '<button class="btn klein" id="abRmNeu" style="margin-top:9px">'+ico("plus")+'Bemerkung aufnehmen</button></div>'+

    /* 6 Ausblick */
    '<div class="card">'+kopf("6","Ausblick")+
    ta("abAusblick","Berichtstermin, Fristen, Verteilerkreis",ab.ausblick)+
    '<button class="btn primary" id="abFertig" style="margin-top:12px;width:100%">'+
    ((a.ablauf&&a.ablauf.abschluss)?"Abschluss wieder öffnen":"Abschlussbesprechung abgeschlossen")+'</button></div>');

  const sammle=async()=>{
    const g=(id)=>{ const el=document.querySelector('#pnlInhalt [data-f="'+id+'"]'); return el?el.value:""; };
    ab.beginn=g("abBeginn"); ab.ende=g("abEnde");
    ab.nichtAbgedeckt=g("abNichtAbgedeckt"); ab.ausblick=g("abAusblick");
    await sichern();
  };
  document.querySelectorAll("#pnlInhalt [data-f]").forEach(el=>el.addEventListener("change",sammle));
  const neuZeichnen=()=>{ panelSchliessen(); abschlussPanel(a); };
  document.getElementById("abTnNeu").onclick=()=>teilnehmerBearbeiten(a,-1,neuZeichnen);
  document.querySelectorAll("[data-tn]").forEach(el=>el.onclick=()=>
    teilnehmerBearbeiten(a,parseInt(el.dataset.tn,10),neuZeichnen));
  document.getElementById("abRmNeu").onclick=()=>rueckmeldungBearbeiten(a,-1,neuZeichnen);
  document.querySelectorAll("[data-rm]").forEach(el=>el.onclick=()=>
    rueckmeldungBearbeiten(a,parseInt(el.dataset.rm,10),neuZeichnen));

  document.getElementById("abFertig").onclick=async()=>{
    await sammle();
    if(!a.ablauf) a.ablauf={};
    if(!a.ablauf.abschluss && !ab.teilnehmer.length){
      toast("Teilnehmende fehlen – wer war dabei, wer ist Ansprechpartner?"); return; }
    a.ablauf.abschluss=!a.ablauf.abschluss; await sichern(); panelSchliessen();
    toast(a.ablauf.abschluss?"Abschluss vermerkt":"Abschluss wieder offen");
  };
}

function teilnehmerBearbeiten(a,i,zurueck){
  const ab=a.abschluss, neu=i<0;

    '<div class="card">'+fld("tnName","Name",x.name)+fld("tnFunktion","Funktion / Bereich",x.funktion)+
    '<label class="hak" style="margin-top:10px"><input type="checkbox" id="tnAnsprech"'+(x.ansprech?" checked":"")+'>'+
    '<span><b>Ansprechpartner für die Maßnahmen</b><br><span class="mini">wird im Bericht und in der '+
    'Maßnahmenübersicht benannt</span></span></label>'+
    '<div class="zwei" style="margin-top:12px">'+
    '<button class="btn primary" id="tnOk">Übernehmen</button>'+
    (neu?"":'<button class="btn gefahr" id="tnWeg">Löschen</button>')+'</div></div>', zurueck);
  document.getElementById("tnOk").onclick=async()=>{
    const g=(id)=>document.querySelector('#pnlInhalt [data-f="'+id+'"]').value;

  if(w) w.onclick=async()=>{ ab.teilnehmer.splice(i,1); await sichern(); panelSchliessen(); };

    '<div class="card"><p class="mini">Sinngemäß festhalten, <b>ohne Wertung der Person</b>. Im Bericht heißt '+
    'es später „in der Abschlussbesprechung wurde thematisiert …“ – ohne Namen.</p>'+
    fld("rmWer","Wer (Name, Funktion)",r.wer)+
    '<label>Bezug</label><select data-f="rmBezug">'+bezugOpt.map(o=>'<option'+(o===r.bezug?" selected":"")+'>'+
      esc(o)+'</option>').join("")+'</select>'+
    ta("rmText","Bemerkung",r.text)+
    '<label>Umgang damit</label><select data-f="rmUmgang">'+UMGANG.map(o=>'<option'+(o===r.umgang?" selected":"")+
      '>'+esc(o)+'</option>').join("")+'</select>'+
    '<div class="zwei" style="margin-top:12px">'+
    '<button class="btn primary" id="rmOk">Übernehmen</button>'+
    (neu?"":'<button class="btn gefahr" id="rmWeg">Löschen</button>')+'</div></div>', zurueck);
  document.getElementById("rmOk").onclick=async()=>{
    const g=(id)=>document.querySelector('#pnlInhalt [data-f="'+id+'"]').value;
    const v={wer:g("rmWer"),bezug:g("rmBezug"),text:g("rmText"),umgang:g("rmUmgang")};
    if(!v.text.trim()){ toast("Bemerkung fehlt"); return; }

    await sichern(); panelSchliessen();
  };
  const w=document.getElementById("rmWeg");
  if(w) w.onclick=async()=>{ ab.rueckmeldungen.splice(i,1); await sichern(); panelSchliessen(); };

/* Aus den angekreuzten Kriterien folgt die Stufe - nicht aus dem Bauchgefuehl.
   Rechtsverstoss oder gefaehrdete Wirksamkeit fuehren zur kritischen Abweichung; die
   uebrigen Kriterien heben eine Nebenabweichung an, wenn mehrere zusammenkommen. */
function stufeVorschlag(kr){
  const an = BEWERTKRIT.filter(k=>kr[k[0]]);
  if(!an.length) return {stufe:"", text:"Noch kein Kriterium gewählt"};
  if(an.some(k=>k[3]==="kritisch"))
    return {stufe:"KA", text:"kritische Abweichung – "+an.filter(k=>k[3]==="kritisch").map(k=>k[1]).join(" und ")};
  if(an.length>=2)
    return {stufe:"KA", text:"kritische Abweichung – "+an.map(k=>k[1]).join(", ")+" treffen zusammen"};
  return {stufe:"N", text:"Nebenabweichung – "+an[0][1]+" allein, Wirksamkeit bleibt erhalten"};
}
/* Baut die Begruendung nach dem Muster der Folie: erst der NACHWEIS, dann je Kriterium
   ein eigener Hauptsatz. Editierbar - der Text ist ein Geruest, kein Endprodukt. */
function begruendungBauen(fs, kr){
  const an = BEWERTKRIT.filter(k=>kr[k[0]]);
  if(!an.length) return "";
  const nw = (fs.nachweisText||"").trim().replace(/\s+/g," ");
  const kurz = nw.length>160 ? nw.slice(0,160)+" …" : nw;
  const satz = {
    umwelt:"Eine Auswirkung auf Boden, Wasser, Luft oder Ressourcen ist möglich.",
    recht:"Damit ist eine Rechtspflicht oder eine Genehmigungsauflage verletzt.",
    system:"Der Sachverhalt ist kein Einzelfall, sondern tritt über Bereiche hinweg auf.",
    wirk:"Die Zielerreichung des Managementsystems ist dadurch gefährdet.",
    erkenn:"Die Organisation hätte dies über die Eigenüberwachung selbst erkennen müssen.",
    wieder:"Der Sachverhalt war bereits Gegenstand einer früheren Feststellung."
  };
  const kopf = kurz ? 'Die Einstufung stützt sich auf den Nachweis „'+kurz+'“. ' : "";
  return kopf + an.map(k=>satz[k[0]]).join(" ");
}

/* ---------- Eroeffnungsbesprechung (Skript 2.6, S. 29) ----------
   Das Audit beginnt nicht am ersten Pruefpunkt, sondern hier. Ohne diesen Schritt fehlt
   die Bestaetigung von Zielen, Umfang und Kriterien - und damit die Grundlage jeder
   spaeteren Feststellung. */
function eroeffnungPanel(a){
  if(!a.eroeffnung) a.eroeffnung={zeit:"",teilnehmer:"",punkte:{},notiz:"",erledigt:false};
  const e=a.eroeffnung;
  const remote = /remote|hybrid/i.test(a.methoden||"");
  const liste = EROEFFNUNG.concat(remote?EROEFFNUNG_REMOTE:[]);
  const zeile=(txt,hinw,i)=>{
    const pflicht = /PFLICHT/.test(hinw);
    return '<label class="hak'+(pflicht?" pflicht":"")+'"><input type="checkbox" data-er="'+i+'"'+
      (e.punkte[i]?" checked":"")+'><span><b>'+esc(txt)+'</b>'+
      (hinw?'<br><span class="mini">'+esc(hinw)+'</span>':"")+'</span></label>';
  };
  oeffnePanel("Eröffnungsbesprechung",
    '<div class="card"><p class="mini">15 bis 30 Minuten. Die Punkte werden <b>bestätigt</b>, nicht vorgetragen – '+
    'Abweichungen zu Zielen, Umfang oder Plan gehören hierhin, nicht in den Bericht.</p>'+
    '<div class="zwei">'+fld("erZeit","Beginn",e.zeit||jetztZeit())+
    '<div><label>Auditgegenstand</label><input value="'+esc(a.gegenstand||a.kunde||"")+'" disabled></div></div>'+
    ta("erTeilnehmer","Teilnehmende (Name, Funktion)",e.teilnehmer)+'</div>'+
    '<div class="card"><h3>Punkte</h3>'+liste.map((x,i)=>zeile(x[0],x[1],i)).join("")+'</div>'+
    '<div class="card">'+ta("erNotiz","Notizen, Zusagen, Abweichungen vom Plan",e.notiz)+
    '<button class="btn primary" id="erFertig" style="margin-top:10px;width:100%">'+
    (e.erledigt?"Eröffnung als offen markieren":"Eröffnung abschließen")+'</button>'+
    tipp("eroeffnung")+'</div>');

  const sammle=async()=>{
    const g=(id)=>{ const el=document.querySelector('#pnlInhalt [data-f="'+id+'"]'); return el?el.value:""; };
    e.zeit=g("erZeit"); e.teilnehmer=g("erTeilnehmer"); e.notiz=g("erNotiz");
    await sichern();
  };
  document.querySelectorAll("#pnlInhalt [data-f]").forEach(el=>el.addEventListener("change",sammle));
  document.querySelectorAll("[data-er]").forEach(el=>el.onchange=async()=>{
    e.punkte[el.dataset.er]=el.checked; await sichern();
  });
  document.getElementById("erFertig").onclick=async()=>{
    if(!e.erledigt){
      const stichprobeIdx = EROEFFNUNG.findIndex(x=>/PFLICHT/.test(x[1]));
      if(!e.punkte[stichprobeIdx]){
        toast("Stichprobenhinweis fehlt – ohne ihn gilt ein Audit ohne Feststellungen als Beleg für Fehlerfreiheit");
        return;
      }
      if(!e.zeit) e.zeit=jetztZeit();
    }
    await sammle();
    e.erledigt=!e.erledigt; await sichern(); panelSchliessen();
    toast(e.erledigt?"Eröffnung abgeschlossen":"Eröffnung wieder offen");
  };
}
