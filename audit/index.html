/* ---------- Checkliste zusammenstellen: die Stichprobe ----------
   Der Katalog ist der Vorrat, nicht das Programm. Das Tool schlaegt eine ueber die Kapitel
   gestreute Auswahl vor - gewichtet nach Umweltwirkung und Rechtsrelevanz - und der Auditor
   passt sie an. "Der Auditor bestimmt das Beispiel" gilt auch fuer die Fragen. */
function auswahlPanel(a){
  const k=katalogFuer(a);
  if(!a.auswahl) a.auswahl=[];
  const kapitel=[]; k.forEach(f=>{ if(!kapitel.includes(f.kapitel)) kapitel.push(f.kapitel); });
  const gew=(kp)=>k.filter(f=>f.kapitel===kp && a.auswahl.includes(f.nr)).length;

  const balken=(n,ges)=>{
    const max=Math.min(ges,12);
    let s="";
    for(let i=0;i<max;i++) s+= (i<Math.min(n,max)) ? "●" : "○";
    return s;
  };
  const zeilen=kapitel.map(kp=>{
    const ges=k.filter(f=>f.kapitel===kp).length, n=gew(kp);
    return '<div class="zeile" data-kap="'+esc(kp)+'"><div class="txt">'+
      '<div class="t1">'+esc(kp)+'</div>'+
      '<div class="t2"><span class="pkt">'+balken(n,ges)+'</span> '+n+' von '+ges+'</div></div>'+
      '<button class="btn klein" data-minus="'+esc(kp)+'">–</button>'+
      '<button class="btn klein" data-plus="'+esc(kp)+'">+</button></div>';
  }).join("");

  oeffnePanel("Checkliste zusammenstellen",
    '<div class="card"><p class="mini">Ein Audit prüft <b>eine begründete Auswahl</b>, nicht den ganzen Katalog. '+
    'Der Vorschlag streut über die Kapitel und gewichtet nach <b>Umweltwirkung und Rechtsrelevanz</b> – '+
    'Schwerpunkt auf Kapitel 6 und 8. Anpassen ist ausdrücklich vorgesehen.</p>'+
    '<div class="zwei"><div><label>Umfang des Vorschlags</label><select id="awZiel">'+
    [20,30,45].map(z=>'<option value="'+z+'"'+((a.auswahlZiel||30)===z?" selected":"")+'>'+z+' Prüfpunkte'+
      (z===20?" – knapp":z===45?" – breit":"")+'</option>').join("")+'</select></div>'+
    '<div><label>Aktuell gewählt</label><input id="awStand" value="'+a.auswahl.length+' von '+k.length+'" disabled></div></div>'+
    '<div class="zwei" style="margin-top:10px">'+
    '<button class="btn" id="awNeu">Vorschlag erzeugen</button>'+
    '<button class="btn gefahr" id="awLeer">Alles abwählen</button></div></div>'+
    '<div class="card"><h3>Je Kapitel</h3><p class="mini">Zeile antippen, um einzelne Punkte zu wählen.</p>'+zeilen+'</div>'+
    '<div class="card"><p class="mini">Was nicht in der Liste steht, bleibt erreichbar: '+
    'im Tab <b>Prüfen</b> über „Punkt aus dem Katalog holen“ und über den <b>freien Befund</b>. '+
    '<i>Auffälligkeiten außerhalb der Checkliste sind zu verfolgen.</i></p></div>');

  const neu=()=>{ panelSchliessen(); auswahlPanel(a); };
  document.getElementById("awZiel").onchange=async(ev)=>{
    a.auswahlZiel=parseInt(ev.target.value,10); await sichern();
  };
  document.getElementById("awNeu").onclick=async()=>{
    a.auswahlRunde=(a.auswahlRunde||0)+1;
    a.auswahl=vorschlagAuswahl(a, a.auswahlZiel||30, a.auswahlRunde);
    S.pruefIdx=0; await sichern(); toast(a.auswahl.length+" Prüfpunkte vorgeschlagen"); neu();
  };
  document.getElementById("awLeer").onclick=async()=>{
    a.auswahl=[]; S.pruefIdx=0; await sichern(); neu();
  };
  document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=async(ev)=>{
    ev.stopPropagation();
    const kp=b.dataset.plus, frei=k.filter(f=>f.kapitel===kp && !a.auswahl.includes(f.nr));
    if(!frei.length) return toast("Kapitel vollständig gewählt");
    a.auswahl.push(frei[0].nr); await sichern(); neu();
  });
  document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=async(ev)=>{
    ev.stopPropagation();
    const kp=b.dataset.minus, drin=k.filter(f=>f.kapitel===kp && a.auswahl.includes(f.nr));
    if(!drin.length) return;
    a.auswahl=a.auswahl.filter(n=>n!==drin[drin.length-1].nr);
    S.pruefIdx=0; await sichern(); neu();
  });
  document.querySelectorAll("[data-kap]").forEach(el=>el.onclick=()=>kapitelAuswahlPanel(a, el.dataset.kap));
}

/* Einzelauswahl innerhalb eines Kapitels */
function kapitelAuswahlPanel(a, kapitel){
  const fr=katalogFuer(a).filter(f=>f.kapitel===kapitel);
  oeffnePanel(kapitel,
    '<div class="card"><p class="mini">'+fr.filter(f=>a.auswahl.includes(f.nr)).length+' von '+fr.length+' gewählt</p>'+
    fr.map(f=>'<label class="hak"><input type="checkbox" data-fnr="'+esc(f.nr)+'"'+
      (a.auswahl.includes(f.nr)?" checked":"")+'><span><b>'+esc(f.nr)+'</b> · '+esc(f.bezug)+'<br>'+
      esc(f.frage)+'</span></label>').join("")+'</div>'+
    '<div class="card"><button class="btn primary" id="kaZurueck" style="width:100%">Fertig</button></div>',
    ()=>auswahlPanel(a));
  document.querySelectorAll("[data-fnr]").forEach(el=>el.onchange=async()=>{
    const nr=el.dataset.fnr;
    if(el.checked){ if(!a.auswahl.includes(nr)) a.auswahl.push(nr); }
    else a.auswahl=a.auswahl.filter(x=>x!==nr);
    S.pruefIdx=0; await sichern();
  });
  document.getElementById("kaZurueck").onclick=()=>panelSchliessen();
}

/* Waehrend des Audits einen weiteren Punkt aus dem Vorrat holen - das Gespraech fuehrt
   oft woandershin als die Liste (Skript: Auffaelligkeiten ausserhalb der Checkliste verfolgen). */
function nachladenPanel(a){
  const k=katalogFuer(a).filter(f=>!a.auswahl.includes(f.nr));
  oeffnePanel("Punkt aus dem Katalog holen",
    '<div class="card"><input id="nlSuch" placeholder="Suchen – Stichwort, Nummer oder Kürzel" autofocus>'+
    '<p class="mini">'+k.length+' Punkte im Vorrat, die nicht in der Arbeitsliste stehen.</p></div>'+
    '<div id="nlTreffer"></div>');
  const mal=(f)=>{
    const s=(f||"").toLowerCase().trim();
    const tr=(s? k.filter(x=>(x.nr+" "+x.bezug+" "+x.frage+" "+x.nachweis+" "+x.kapitel).toLowerCase().includes(s)) : k).slice(0,25);
    document.getElementById("nlTreffer").innerHTML = !tr.length
      ? '<div class="card"><p class="mini">Kein Treffer.</p></div>'
      : '<div class="card">'+tr.map(x=>'<div class="zeile" data-hol="'+esc(x.nr)+'"><div class="txt">'+
          '<div class="t1">'+esc(x.nr)+' · '+esc(x.bezug)+'</div><div class="t2">'+esc(x.frage)+'</div></div>'+
          ico("plus","chev")+'</div>').join("")+'</div>';
    document.querySelectorAll("[data-hol]").forEach(el=>el.onclick=async()=>{
      a.auswahl.push(el.dataset.hol); await sichern(); panelSchliessen();
      toast("Prüfpunkt "+el.dataset.hol+" übernommen");
    });
  };
  mal("");
  document.getElementById("nlSuch").addEventListener("input",e=>mal(e.target.value));
}

/* ---------- Export ---------- */
function exportPanel(a){
  oeffnePanel("Export",
    '<div class="card"><h3>Auditdaten sichern</h3>'+
    '<p class="mini">Die Datei enthält Auditrahmen, Zeitschiene, alle Prüfpunkte mit Nachweisen und '+
    'Stichproben sowie die Feststellungen nach A4. Daraus entsteht am PC der Auditbericht.</p>'+
    '<button class="btn primary" id="expPortal" style="width:100%;margin-top:10px">'+ico("hoch")+
    'Ins Portal senden</button>'+
    '<div class="hinweis" id="expStatus" style="margin-top:9px" hidden></div>'+
    '<p class="mini" style="margin-top:9px">Der Upload geht in den <b>internen</b> Rohordner. '+
    'Der Kunde sieht davon nichts – ins Portal kommt später nur der fertige, von dir '+
    'freigegebene Auditbericht.</p>'+
    '<button class="btn" id="expJson" style="width:100%;margin-top:10px">'+ico("doc")+'Stattdessen als Datei sichern</button>'+
    '<button class="btn" id="expText" style="width:100%;margin-top:8px">'+ico("doc")+'Kurzbericht als Text</button>'+
    '</div>');
  document.getElementById("expPortal").onclick=async(e)=>{
    const b=e.currentTarget; b.disabled=true;
    try{ await auditInsPortal(a, document.getElementById("expStatus")); }
    finally{ b.disabled=false; }
  };
  document.getElementById("expJson").onclick=()=>{
    lade(JSON.stringify(auditPaket(a),null,1), auditDateiname(a), "application/json");
  };
  document.getElementById("expText").onclick=()=>{
    /* Der Entwurf folgt der Berichtsgliederung (Skript 3.6, S. 39) - Abschnitt fuer Abschnitt,
       damit am PC nur noch formuliert und nicht mehr sortiert werden muss. */
    const ab=a.abschluss||{}, fr=fragenFuer(a);
    const rang={KA:0,N:1,P:2,K:3,"":4};
    const sortiert=a.feststellungen.slice().sort((x,y)=>(rang[x.bewertung||""]-rang[y.bewertung||""])||(x.nr-y.nr));
    const z=(b)=>a.feststellungen.filter(f=>f.bewertung===b).length;
    let t="";

    t+="1 DECKBLATT\n";
    t+="  Organisation: "+(a.kunde||"—")+"\n  Bereich: "+(a.gegenstand||"—")+"\n  Standort: "+(a.standort||"—")+"\n";
    t+="  Auditauftraggeber: "+(a.auftraggeber||"—")+"\n  Auditteam: "+(a.team||"—")+"\n";
    t+="  Audittermin: "+(a.termine[0]&&a.termine[0].zeit?a.angelegt+" ab "+a.termine[0].zeit:a.angelegt)+"\n";
    t+="  Berichtsdatum: "+(a.berichtsdatum||"—")+"\n  Vertraulichkeit: "+(a.vertraulich||"—")+"\n";
    t+="  Verteilerkreis: "+(a.verteiler||"—")+"\n";

    t+="\n2 ZUSAMMENFASSUNG\n";
    t+="  "+z("KA")+" kritische Abweichungen, "+z("N")+" Nebenabweichungen, "+z("P")+" Verbesserungspotenziale, "+
       ((a.staerken||[]).length)+" Stärken.\n";
    t+="  "+(a.schlussfolgerung||"[Aussage zur Wirksamkeit ergänzen]")+"\n";

    t+="\n3 AUDITGRUNDLAGEN\n";
    const dz=DISZIPLINEN[a.disziplin||"umwelt"]||DISZIPLINEN.umwelt;
    t+="  Disziplin: "+dz.name+"\n";
    t+="  Regelwerk: "+((a.disziplin||"umwelt")==="umwelt"
        ? "ISO 14001:"+(a.normfassung||"2026")+(a.modus==="emas"?" + EMAS (Anhang I–IV)":"")
        : dz.norm)+"\n";
    t+="  Auditart: "+AUDITARTEN[a.auditart||"system"].name+"\n";
    t+="  Auditziele: "+(a.ziele||"—")+"\n  Auditumfang: "+(a.umfang||"—")+"\n  Auditkriterien: "+(a.kriterien||"—")+"\n";
    t+="  Auditmethoden: "+(a.methoden||"—")+"\n";
    const rb=bereicheAktiv(a);
    if(rb.length) t+="  Rechtsbereiche: "+rb.map(b=>b[1]).join(", ")+"\n";
    t+="  Stichprobenumfang: "+fr.filter(f=>istBearbeitet(a,f)).length+" von "+fr.length+
       " Prüfpunkten der Arbeitsliste, ausgewählt aus einem Katalog von "+katalogFuer(a).length+".\n";
    t+="  Einschränkungen: "+(ab.nichtAbgedeckt||"keine")+"\n";

    t+="\n4 ABLAUF\n";
    a.termine.forEach(x=>t+="  "+(x.zeit||"--:--")+(x.bis?"–"+x.bis:"")+"  "+(x.thema||"")+
      (x.abteilung?"  ["+x.abteilung+(x.kst?", Kst. "+x.kst:"")+"]":"")+
      (x.partner?"  Gesprächspartner: "+x.partner:"")+(x.methode&&x.methode!=="vor Ort"?"  ("+x.methode+")":"")+"\n");

    t+="\n5 FESTSTELLUNGEN\n";
    if(!sortiert.length) t+="  keine\n";
    sortiert.forEach(f=>{
      t+="\n  Nr. "+f.nr+"  ["+(f.bewertung||"offen")+"]  "+(f.bereich||"")+"\n";
      t+="    Anforderung: "+(f.anforderung||"")+"\n    Nachweis: "+(f.nachweisText||"")+"\n";
      t+="    Abweichung: "+(f.abweichung||"")+"\n";
      const kr=BEWERTKRIT.filter(k=>(f.kriterien||{})[k[0]]).map(k=>k[1]);
      if(kr.length) t+="    Einstufungskriterien: "+kr.join(", ")+"\n";
      if(f.begruendung) t+="    Begründung: "+f.begruendung+"\n";
    });

    t+="\n6 STÄRKEN UND POTENZIALE\n";
    if(!(a.staerken||[]).length) t+="  keine festgehalten\n";
    (a.staerken||[]).forEach(x=>{
      t+="\n  Nr. "+x.nr+"  "+(x.bereich||"")+"\n    "+(x.was||"")+"\n    Nachweis: "+(x.nachweis||"")+"\n";
      if(x.uebertragbar) t+="    Übertragbar auf: "+x.uebertragbar+"\n";
    });

    t+="\n7 SCHLUSSFOLGERUNGEN\n";
    t+="  "+(a.schlussfolgerung||"[Aussage zur Erfüllung der Auditkriterien und zur Wirksamkeit ergänzen]")+"\n";
    t+="  Erfüllungsgrad: "+(a.erfuellung||"[ergänzen]")+"\n";

    t+="\n8 MASSNAHMENÜBERSICHT (A6)\n";
    const mit=a.feststellungen.filter(f=>f.massnahme||f.verantwortlich||f.termin);
    if(!mit.length) t+="  noch keine Maßnahmen vereinbart\n";
    mit.forEach(f=>t+="  Nr. "+f.nr+" | "+(f.abweichung||"").slice(0,60)+" | "+(f.bewertung||"")+" | "+
      (f.massnahme||"")+" | "+(f.verantwortlich||"")+" | "+(f.termin||"")+" | "+(f.status||"offen")+"\n");

    t+="\n9 ANLAGEN\n  Auditplan · ausgefüllte Checkliste · Nachweisverzeichnis · Fotodokumentation\n";

    if((ab.teilnehmer||[]).length || (ab.rueckmeldungen||[]).length || ab.ausblick){
      t+="\nANLAGE: PROTOKOLL DER ABSCHLUSSBESPRECHUNG\n";
      if(ab.beginn||ab.ende) t+="  Zeit: "+(ab.beginn||"")+(ab.ende?"–"+ab.ende:"")+"\n";
      (ab.teilnehmer||[]).forEach(x=>t+="  Teilnehmend: "+x.name+(x.funktion?", "+x.funktion:"")+
        (x.ansprech?"  [Ansprechpartner für die Maßnahmen]":"")+"\n");
      (ab.rueckmeldungen||[]).forEach(r=>t+="\n  Rückmeldung"+(r.bezug?" zu "+r.bezug:"")+": "+r.text+
        "\n    Umgang: "+(r.umgang||"—")+"\n");
      if(ab.ausblick) t+="\n  Ausblick: "+ab.ausblick+"\n";
    }

    t+="\nHinweis: Entwurf aus dem Feld-Tool, gegliedert nach Skript 3.6. Formulierung und Schlussfolgerungen\n";
    t+="entstehen am PC. Sachlich und beschreibend, ohne Wertung von Personen; Empfehlungen nicht in den\n";
    t+="Feststellungstext.\n";
    lade(t,"Auditbericht_Entwurf_"+heute()+".txt","text/plain");
  };
}
function lade(inhalt,name,typ){
  const b=new Blob([inhalt],{type:typ+";charset=utf-8"});
  const u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},400);
  toast("Datei erzeugt");
}

/* ===== Offline =====
   Ein Audit laeuft durch Hallen, Lager und Aussenanlagen - dort ist kein Empfang. Ohne
   Service Worker landet der Start ohne Netz auf der Fehlerseite des Browsers und der
   Audittag ist verloren (genau daran ist die Begehung am 22.07.2026 gescheitert).
   Faellt die Registrierung aus (lokale Datei, altes Geraet), laeuft die App wie bisher. */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      /* Ein Update still im Hintergrund zu installieren waere falsch: die App liefe den
         Audittag ueber weiter, und niemand saehe, WELCHE Fassung laeuft. Sie sagt es selbst
         und laesst sich mit einem Tipp erneuern. */
      reg.addEventListener("updatefound",()=>{
        const neu=reg.installing; if(!neu) return;
        neu.addEventListener("statechange",()=>{
          if(neu.state==="installed" && navigator.serviceWorker.controller) zeigeUpdateBanner();
        });
      });
      const pruefen=()=>{ if(navigator.onLine!==false) reg.update().catch(()=>{}); };
      pruefen();
      document.addEventListener("visibilitychange",()=>{ if(!document.hidden) pruefen(); });
    }).catch(()=>{});
  });
}
function zeigeUpdateBanner(){
  if(document.getElementById("updBan")) return;
  const b=document.createElement("div"); b.id="updBan";
  b.style.cssText="position:fixed;left:12px;right:12px;bottom:78px;z-index:9999;background:#1B4332;"
    +"color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;"
    +"box-shadow:0 6px 20px rgba(0,0,0,.28);font-size:15px";
  b.innerHTML='<span style="flex:1">Neue Fassung verf\u00fcgbar.</span>'
    +'<button type="button" id="updSpaeter" style="background:none;border:0;color:#B7E4C7;font-size:15px">Sp\u00e4ter</button>'
    +'<button type="button" id="updJetzt" style="background:#52B788;border:0;color:#0B2B1D;'
    +'border-radius:9px;padding:8px 12px;font-weight:600;font-size:15px">Neu laden</button>';
  document.body.appendChild(b);
  b.querySelector("#updSpaeter").addEventListener("click",()=>b.remove());
  b.querySelector("#updJetzt").addEventListener("click",()=>location.reload());
}
